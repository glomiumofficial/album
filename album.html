    // after mount, and touching it early threw and froze the loader at 000.
    for (let t = 0; !window.supabase && t < 100; t++) await sleep(100);
    if (window.supabase && !this.sb) this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    if (slug && !this.sb) this.setState({ loading: false, slug, loadError: 'the connection dropped before the album arrived. your link is fine — try again.' });
    else if (slug) await this.load(slug);
    else this.setState({ loading: false, notFound: true });
    bump();
    const s = this.state, urls = [], mob = this.state.isMobile;
    if (s.event) {
      urls.push(s.event.cover_url_view || s.event.cover_url);
      // On a phone the first screen is the cover alone — waiting on a dozen
      // grid photos only held the loader and fought the page for bandwidth.
      s.media.filter(m => m.kind !== 'video').slice(0, mob ? 4 : 12)
        .forEach(m => urls.push(m.full_bleed ? (m.url_view || m.url) : (m.url_grid || m.url)));
    }
    const list = Array.from(new Set(urls.filter(Boolean)));
    this.L.total += list.length;
    const img = (u, k) => new Promise(res => {
      const i = new Image(); i.decoding = 'async';
      i.onload = () => (k === 0 && i.decode ? i.decode() : Promise.resolve()).catch(() => {}).then(res);
      i.onerror = res; i.src = u;
    }).then(bump);
    // The hero cover is non-negotiable: the loader never lifts onto a black
    // hero. It gets its own, longer ceiling; the grid photos stay capped.
    const jobs = list.map(img), cover = jobs[0] || Promise.resolve();
    await Promise.race([Promise.all([fonts].concat(jobs)), sleep(mob ? 6000 : 10000)]);
    await Promise.race([cover, sleep(20000)]);
    await sleep(Math.max(0, 1400 - (performance.now() - this.L.t0)));
    this.L.done = this.L.total;
    await sleep(650);
    this.finishLoad();
  }

  // The cover settles and the title block rises as the loader lifts.
  intro() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    const c = document.querySelector('[data-cover]');
    if (c && c.animate) c.animate([{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 2600, easing: ease, fill: 'both' });
    document.querySelectorAll('[data-rise]').forEach((el, i) => el.animate && el.animate(
      [{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'none' }],
      { duration: 1300, delay: 380 + i * 140, easing: ease, fill: 'both' }));
  }

  finishLoad() {
    if (!this.L || this.L.finished || this.unmounted) return;
    this.L.finished = true;
    clearTimeout(this.safety);
    // Never lift the loader onto an empty page: if the album still has not
    // arrived, show the retry screen instead of a blank white one.
    const s = this.state;
    if (!s.event && !s.notFound && !s.loadError) this.setState({ loading: false, loadError: 'the connection dropped before the album arrived. your link is fine — try again.' });
    document.body.style.overflow = this.state.lightboxOpen ? 'hidden' : '';
    if (this.loadLabelRef.current) this.loadLabelRef.current.textContent = 'ready';
    if (this.loaderRef.current) this.loaderRef.current.style.clipPath = 'inset(0% 0% 100% 0%)';
    this.intro();
    setTimeout(() => { if (!this.unmounted) { this.setState({ loaderGone: true }); this.prefetchRest(); } }, 1200);
  }

  // After the reveal, warm photos a few screens ahead of the reader, two at a
  // time at low priority, and extend the window as they scroll. Warming the
  // whole album up front cost hundreds of MB per visit on large weddings.
  // Skipped on Data Saver / 2G.
  prefetchRest() {
    const c = navigator.connection;
    if (c && (c.saveData || /2g/.test(c.effectiveType || ''))) return;
    const urls = [];
    this.state.media.forEach(m => {
      if (m.kind === 'video') { if (m.thumb_url) urls.push(m.thumb_url); return; }
      urls.push(m.full_bleed ? (m.url_view || m.url) : (m.url_grid || m.url));
    });
    this.warmList = Array.from(new Set(urls.filter(Boolean)));
    this.warmAt = 0; this.warmLimit = 0;
    this.warmAhead();
  }
  warmAhead() {
    const list = this.warmList;
    if (!list || this.unmounted) return;
    const doc = document.documentElement, h = Math.max(1, doc.scrollHeight);
    const frac = Math.min(1, (window.scrollY + window.innerHeight * 3) / h);
    const ahead = this.state.isMobile ? 10 : 30;
    const limit = Math.min(list.length, Math.ceil(frac * list.length) + ahead);
    if (limit <= this.warmLimit) return;
    this.warmLimit = limit;
    const worker = async () => {
      while (!this.unmounted && this.warmAt < this.warmLimit) {
        const u = list[this.warmAt++];
        await new Promise(r => { const im = new Image(); try { im.fetchPriority = 'low'; } catch (e) {} im.onload = im.onerror = r; im.src = u; });
      }
      this.warmers--;
    };
    while ((this.warmers || 0) < (this.state.isMobile ? 1 : 2)) { this.warmers = (this.warmers || 0) + 1; worker(); }
  }

  // Single source of truth for the tab title. The <helmet> title is a static
  // literal, injected on stream completion; this runs after that and on every
  // update, so the event name always wins once it loads.
  syncTitle() {
    const e = this.state.event;
    const t = e && e.couple_names ? 'creative INFINITELY — ' + e.couple_names : 'creative INFINITELY';
    if (document.title !== t) document.title = t;
  }

  componentDidUpdate() { this.syncTitle(); }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('fullscreenchange', this.onFsChange);
    if (this._scrollRaf) cancelAnimationFrame(this._scrollRaf);
    this.unmounted = true;
    clearTimeout(this.safety);
    cancelAnimationFrame(this._loadRaf);
    this.stopSlideshow();
  }

  // Once per frame, and only when the state flips.
  onScroll = () => {
    if (this._scrollRaf) return;
    this._scrollRaf = requestAnimationFrame(() => {
      this._scrollRaf = 0;
      if (this.warmList) this.warmAhead();
      const past = window.scrollY > window.innerHeight * 0.85;
      if (past === this._barOn) return;
      let bar = this.topbarEl;
      if (!bar) {
        bar = this.topbarEl = document.querySelector('[data-el="topbar"]');
        // A live blur over a scrolling photo grid is what blanked phone screens.
        if (bar && this.state.isMobile) { bar.style.backdropFilter = 'none'; bar.style.webkitBackdropFilter = 'none'; bar.style.background = '#FFFFFF'; }
      }
      if (!bar) return;
      this._barOn = past;
      bar.style.opacity = past ? '1' : '0';
      bar.style.pointerEvents = past ? 'auto' : 'none';
    });
  };

  // Every tile reserves its box before a byte arrives. A lazy image with no
  // size is 0px tall, so a column of 300 of them all sat inside the viewport
  // and the browser fetched the whole album on page load — then the masonry
  // jumped as each one landed. Rows uploaded after audit-2026-09-23 carry
  // width/height; older rows get a portrait placeholder that settles to the
  // real ratio on load. Guarded, so a re-render (a lightbox step, a resize)
  // never re-runs source selection on hundreds of images.
  wireImg(el, m, sizes) {
    const g = m.url_grid || m.url, v = m.url_view || m.url;
    if (!el || !g) return;
    // R-09: the placeholder shape belongs to this address, not to the element —
    // a reused <img> gets its box reset when it is handed a different photo.
    if (el._arFor !== g) {
      el._arFor = g;
      const known = m.width > 0 && m.height > 0;
      el.style.aspectRatio = known ? m.width + ' / ' + m.height : '4 / 5';
      el.style.backgroundColor = '#F1F4F3';
      if (!known) el.addEventListener('load', () => { if (el._arFor === g && el.naturalWidth) el.style.aspectRatio = el.naturalWidth + ' / ' + el.naturalHeight; }, { once: true });
    }
    if (el.getAttribute('sizes') !== sizes) el.sizes = sizes;
    if (el.getAttribute('src') !== g) {
      // Desktop: each frame fades in once its bytes land. Phones paint as bytes
      // arrive — a hidden-until-loaded tile read as a blank white page on a
      // fast scroll over a slow line.
      const fade = !this.state.isMobile;
      const show = () => { el.style.opacity = '1'; };
      if (fade) {
        el.style.opacity = '0';
        el.addEventListener('load', show, { once: true });
        el.addEventListener('error', show, { once: true });
      } else { el.style.opacity = '1'; el.style.transition = 'none'; }
      const set = this.srcsetFor(m, g, v);
      if (set) el.srcset = set; else el.removeAttribute('srcset');
      el.src = g;
      if (fade && el.complete && el.naturalWidth) show();
    }
  }

  // R-02: width descriptors come from stored dimensions only. Old rows with no
  // width get a plain src — a guessed "2800w" makes phones pick the wrong file.
  srcsetFor(m, g, v) {
    if (!v || v === g || !(m.width > 0 && m.height > 0)) return '';
    const at = max => Math.round(m.width * Math.min(1, max / Math.max(m.width, m.height)));
    const gw = at(1200), vw = m.url_view ? at(2800) : m.width;
    return vw > gw ? g + ' ' + gw + 'w, ' + v + ' ' + vw + 'w' : '';
  }

  onKeyDown = (e) => {
    if (!this.state.lightboxOpen) return;
    if (e.key === 'Escape') { this.closeLightbox(); return; }
    // Arrow keys belong to the video's own scrubber when it has focus — otherwise
    // one press both seeks the film and jumps to the next item.
    const t = e.target;
    if (t && (t.tagName === 'VIDEO' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowLeft') this.step(-1);
    if (e.key === 'ArrowRight') this.step(1);
  };

  // Only an absent function is worth falling back for — that is a database
  // older than get_album. Every other error is a failure to REACH the data,
  // and since the hardening migration revoked anon's table grants the direct
  // read cannot rescue it anyway: it just relabels the failure "not found".
  rpcMissing(err) {
    const code = String((err && err.code) || '');
    const msg = String((err && err.message) || '').toLowerCase();
    return code === 'PGRST202' || code === '404'
      || msg.includes('could not find the function') || msg.includes('does not exist');
  }

  retry = () => {
    if (!this.state.slug) return;
    if (!this.sb && window.supabase) this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    if (this.sb) this.load(this.state.slug); else window.location.reload();
  };

  async load(slug) {
    const OFFLINE = 'the connection dropped before the album arrived. your link is fine — try again.';
    this.setState({ loading: true, notFound: false, loadError: '', slug });
    try {
      // get_album returns only the columns an album page renders, so the client's
      // phone, email and PAN on the events row are never readable from here.
      let ev = null, media = null;
      // A request that never answers used to leave the page white until a
      // reload. Give each try 10s, retry once, then offer the retry screen.
      const TIMEOUT = { error: { code: 'timeout', message: 'timeout' } };
      const ask = () => Promise.race([this.sb.rpc('get_album', { p_slug: slug }), new Promise(r => setTimeout(() => r(TIMEOUT), 10000))]);
      let rpc = await ask();
      if (rpc === TIMEOUT && !this.unmounted) rpc = await ask();

      if (rpc.error) {
        // A client on hotel wifi used to be told their album did not exist.
        if (!this.rpcMissing(rpc.error)) { this.setState({ loading: false, loadError: OFFLINE }); return; }
        const direct = await this.sb.from('events').select('*').eq('slug', slug).maybeSingle();
        if (direct.error) { this.setState({ loading: false, loadError: OFFLINE }); return; }
        if (!direct.data) { this.setState({ loading: false, notFound: true }); return; }
        ev = direct.data;
        const m = await this.sb.from('media').select('*').eq('event_id', ev.id).order('sort_order', { ascending: true });
        if (m.error) { this.setState({ loading: false, loadError: OFFLINE }); return; }
        media = m.data || [];
      } else {
        // The function answered. A null event means either no such slug or an
        // album that is not published yet — deliberately indistinguishable from
        // out here, so an unsent album cannot be confirmed to exist by guessing.
        if (!rpc.data || !rpc.data.event) { this.setState({ loading: false, notFound: true }); return; }
        ev = rpc.data.event; media = rpc.data.media || [];
      }
      this.setState({ loading: false, event: ev, media: (media || []).filter(x => x.url) });
      this.logVisit(slug);
    } catch (e) { this.setState({ loading: false, loadError: OFFLINE }); }
  }

  logVisit(slug) {
    if (this._logged === slug) return; this._logged = slug;
    this.sb.rpc('log_album_visit', { p_slug: slug }).then(() => {}, () => {});
  }

  share() {
    const url = window.location.href;
    if (navigator.share) { navigator.share({ title: this.state.event.couple_names, url }).catch(() => {}); return; }
    const done = label => { this.setState({ shareLabel: label }); setTimeout(() => { if (!this.unmounted) this.setState({ shareLabel: 'share album' }); }, 1800); };
    if (!navigator.clipboard || !navigator.clipboard.writeText) { window.prompt('copy this link', url); return; }
    navigator.clipboard.writeText(url).then(() => done('link copied'), () => window.prompt('copy this link', url));
  }

  openLightbox(idx) {
    this.scrollLock(true);
    this.setState({ lightboxOpen: true, lightboxIndex: idx });
  }
  closeLightbox() {
    this.stopSlideshow();
    this.scrollLock(false);
    this.setState({ lightboxOpen: false });
  }

  // Without this the album scrolls under the overlay — worst on mobile, where the
  // viewer closes the lightbox and finds themselves somewhere else entirely.
  scrollLock(on) {
    const b = document.body;
    if (on) {
      this.savedScrollY = window.scrollY;
      b.style.overflow = 'hidden';
    } else {
      b.style.overflow = '';
      if (this.savedScrollY != null) window.scrollTo(0, this.savedScrollY);
    }
  }

  step(dir) {
    const n = this.state.media.length;
    if (!n) return;
    this.setState({ lightboxIndex: (this.state.lightboxIndex + dir + n) % n });
  }

  // A slideshow is a photo experience — landing on a film would autoplay it for
  // three seconds and then cut away mid-sentence.
  stepPhoto(dir) {
    const media = this.state.media, n = media.length;
    if (!n) return;
    let i = this.state.lightboxIndex;
    for (let hop = 0; hop < n; hop++) {
      i = (i + dir + n) % n;
      if (media[i] && media[i].kind !== 'video') { this.setState({ lightboxIndex: i }); return; }
    }
    this.stopSlideshow();
  }

  toggleSlideshow() {
    if (this.state.slideshowPlaying) { this.stopSlideshow(); return; }
    this.setState({ slideshowPlaying: true });
    this.slideTimer = setInterval(() => this.stepPhoto(1), 3000);
  }
  stopSlideshow() {
    if (this.slideTimer) { clearInterval(this.slideTimer); this.slideTimer = null; }
    if (this.state.slideshowPlaying) this.setState({ slideshowPlaying: false });
  }

  // Browsers resume the instant ~0.2s is buffered, then stall again a moment later —
  // which reads as repeated stutter even on a fast line. Hold playback until there is
  // a real cushion ahead of the playhead, then let it run.
  wireStallGuard(el) {
    if (el.dataset.guard) return;
    el.dataset.guard = '1';
    const CUSHION = 6;
    const MAX_HOLD = 2500;
    let holding = false, holdTimer = null, watchdog = null;

    const ahead = () => {
      const b = el.buffered;
      for (let i = 0; i < b.length; i++) {
        if (el.currentTime >= b.start(i) - 0.25 && el.currentTime <= b.end(i)) return b.end(i) - el.currentTime;
      }
      return 0;
    };
    const nearEnd = () => el.duration && el.currentTime + ahead() >= el.duration - 0.4;

    const release = () => {
      if (!holding) return;
      holding = false;
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (watchdog) { clearInterval(watchdog); watchdog = null; }
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
    };
    const check = () => { if (holding && (ahead() >= CUSHION || nearEnd())) release(); };

    const hold = () => {
      // A seek fires 'waiting' while the browser jumps; that is not starvation,
      // and holding here is what made scrubbing freeze.
      if (holding || el.paused || el.ended || el.seeking) return;
      // readyState 3+ means the browser already has enough to keep playing — a
      // cached file reports this and needs no help from us.
      if (el.readyState >= 3 || ahead() >= CUSHION || nearEnd()) return;
      holding = true;
      el.pause();
      // A cached video fires almost no progress events, so an event-only release
      // can wait forever. Poll, and give up holding after a hard ceiling either way.
      watchdog = setInterval(check, 250);
      holdTimer = setTimeout(release, MAX_HOLD);
    };

    el.addEventListener('waiting', hold);
    // 'stalled' only means the network went quiet — a fully buffered file fires
    // it too — so it no longer triggers a hold.
    el.addEventListener('seeking', () => {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (watchdog) { clearInterval(watchdog); watchdog = null; }
      if (holding) { holding = false; const p = el.play(); if (p && p.catch) p.catch(() => {}); }
    });
    el.addEventListener('progress', check);
    el.addEventListener('canplay', check);
    el.addEventListener('canplaythrough', check);
    el.addEventListener('timeupdate', check);
    // Any deliberate tap on the player outranks the guard.
    el.addEventListener('play', () => {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (watchdog) { clearInterval(watchdog); watchdog = null; }
      holding = false;
    });
    el.addEventListener('emptied', () => {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (watchdog) { clearInterval(watchdog); watchdog = null; }
      holding = false;
    });
  }

  toggleFullscreen() {
    const el = this.lightboxVideoEl;
    if (!el) return;
    if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); return; }
    // iOS Safari only exposes the proprietary video fullscreen API.
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen();
  }

  onFsChange = () => this.setState({ isFullscreen: !!document.fullscreenElement });

  // Cross-origin hrefs ignore the download attribute, so fetch to a Blob and
  // click a same-origin object URL instead.
  async downloadUrl(url, name) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const obj = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = obj; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(obj), 4000);
    } catch (e) { window.open(url, '_blank'); }
  }

  // Always append the real extension — a named item would otherwise download
  // as a bare, extensionless file that the OS can't open.
  fileNameFor(item) {
    const src = String(item.url).split('?')[0];
    const raw = src.split('/').pop() || '';
    const ext = (raw.split('.').pop() || '').toLowerCase();
    const safeExt = /^[a-z0-9]{2,5}$/.test(ext) ? ext : (item.kind === 'video' ? 'mp4' : 'jpg');
    if (!item.name || !item.name.trim()) return raw || 'file.' + safeExt;
    const base = item.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'file';
    return base + '.' + safeExt;
  }

  async downloadCurrent() {
    const item = this.state.media[this.state.lightboxIndex];
    if (!item) return;
    const name = this.fileNameFor(item);
    // Buffering a multi-hundred-MB film into a Blob crashes phones. Storage can set
    // the attachment header itself, so hand the save straight to the browser.
    if (item.kind === 'video') {
      const sep = item.url.indexOf('?') === -1 ? '?' : '&';
      const a = document.createElement('a');
      a.href = item.url + sep + 'download=' + encodeURIComponent(name);
      a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    this.downloadUrl(item.url, name);
  }

  shareCurrent() {
    const item = this.state.media[this.state.lightboxIndex];
    if (!item) return;
    if (navigator.share) { navigator.share({ title: item.name || this.state.event.couple_names, url: item.url }).catch(() => {}); return; }
    navigator.clipboard.writeText(item.url);
  }

  renderVals() {
    const s = this.state;
    const fmtDate = d => { if (!d) return ''; const t = new Date(d + 'T00:00:00'); return isNaN(t.getTime()) ? '' : t.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); };

    const indexed = s.media.map((m, i) => ({ ...m, idx: i }));
    // Masonry that keeps its bottom edge: each photo drops into the shortest
    // column by its real proportions. A short run stays at full-grid column
    // width and centres, instead of stretching one photo across the page.
    const cols = s.isMobile ? 2 : (s.wide ? 4 : 3);
    const G = 'clamp(10px,1.4vw,20px)';
    const sizes = s.isMobile ? '50vw' : (s.wide ? '25vw' : '34vw');
    const blocks = [];
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const items = run.map(ph => ({
        ...ph,
        aria: ph.name ? 'open ' + ph.name : 'open photo ' + (ph.idx + 1),
        setImgRef: el => this.wireImg(el, ph, sizes),
        openLightbox: () => this.openLightbox(ph.idx),
      }));
      const n = Math.min(cols, items.length);
      const columns = Array.from({ length: n }, () => ({ items: [], h: 0 }));
      items.forEach(it => {
        const r = it.width > 0 && it.height > 0 ? it.height / it.width : 1.25;
        let c = columns[0];
        columns.forEach(x => { if (x.h < c.h - 0.001) c = x; });
        c.items.push(it); c.h += r;
      });
      const width = n < cols ? 'calc((100% - ' + (cols - 1) + ' * ' + G + ') * ' + (n / cols).toFixed(4) + ' + ' + (n - 1) + ' * ' + G + ')' : '100%';
      blocks.push({ isGrid: true, isFull: false, width, columns: columns.map(x => ({ items: x.items })) });
      run = [];
    };
    for (const m of indexed) {
      if (m.kind === 'video') continue;
      if (m.full_bleed) {
        flush();
        blocks.push({ isGrid: false, isFull: true, item: m, name: m.name || '', aria: m.name ? 'open ' + m.name : 'open photo ' + (m.idx + 1), setImgRef: el => this.wireImg(el, m, '100vw'), openLightbox: () => this.openLightbox(m.idx) });
      } else run.push(m);
    }
    flush();

    // Videos always sit below the full photo grid, in their own labelled section.
    const videos = indexed.filter(m => m.kind === 'video').map((m, vi) => ({
      ...m,
      no: String(vi + 1).padStart(2, '0'), title: (m.name && m.name.trim()) || 'film',
      label: m.name || '',
      hasLabel: !!(m.name && m.name.trim()),
      open: () => this.openLightbox(m.idx),
      setVideoRef: el => {
        if (!el || !m.url || el.dataset.wired) return;
        el.dataset.wired = '1';
        // A custom cover means this tile needs no video bytes at all.
        if (m.thumb_url) {
          el.preload = 'none';
          el.poster = m.thumb_url;
          el.dataset.frozen = '1';
          const probe = new Image();
          probe.onload = () => {
            el.style.aspectRatio = probe.naturalWidth + ' / ' + probe.naturalHeight;
            el.style.height = 'auto';
          };
          probe.src = m.thumb_url;
          return;
        }
        el.preload = 'metadata';
        el.src = m.url;
        // Fit each film to its own frame — vertical reels stay vertical instead of
        // sitting letterboxed inside a wide black box.
        const fit = () => {
          const w = el.videoWidth, h = el.videoHeight;
          if (!w || !h) return;
          el.style.aspectRatio = w + ' / ' + h;
          el.style.height = 'auto';
          if (el.currentTime === 0) { try { el.currentTime = 0.12; } catch (err) {} }
        };
        // Once a real frame exists, freeze it into a poster and DROP the source.
        // Otherwise every tile keeps a live range request open against storage and
        // starves the film the viewer is actually watching.
        const freeze = () => {
          const w = el.videoWidth, h = el.videoHeight;
          if (!w || !h || el.dataset.frozen) return;
          el.dataset.frozen = '1';
          try {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(el, 0, 0, w, h);
            el.poster = c.toDataURL('image/jpeg', 0.72);
          } catch (err) {}
          el.removeAttribute('src');
          try { el.load(); } catch (err) {}
        };
        el.addEventListener('loadedmetadata', fit);
        el.addEventListener('seeked', freeze);
        el.addEventListener('loadeddata', freeze);
        if (el.readyState >= 1) fit();
      },
    }));

    const current = s.media[s.lightboxIndex] || null;
    const nPhotos = indexed.length - videos.length, nMedia = s.media.length, dg = Math.max(2, String(nMedia).length);
    const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
    const dateLabel = s.event ? fmtDate(s.event.event_date) : '';
    const footerMeta = [dateLabel, s.event && s.event.venue].filter(Boolean).join(' · ');
    const isVideoItem = !!(current && current.kind === 'video');

    return {
      loading: s.loading, notFound: s.notFound, hasEvent: !!s.event,
      loadError: s.loadError, hasLoadError: !!s.loadError, retry: this.retry,
      pageTitle: s.event ? s.event.couple_names + ' — Infinitely' : 'Infinitely — Glomium',
      event: s.event || {}, dateLabel, hasDate: !!dateLabel, hasVenue: !!(s.event && s.event.venue),
      footerMeta, hasFooterMeta: !!footerMeta,
      blocks, videos, hasVideos: videos.length > 0, hasPhotos: nPhotos > 0,
      photosHead: '01 — photographs', photoCount: String(nPhotos),
      filmsHead: (nPhotos ? '02' : '01') + ' — films', filmCount: String(videos.length),
      filmsTop: nPhotos ? 'clamp(120px,14vw,200px)' : '0px',
      countLabel: [nPhotos ? plural(nPhotos, 'photograph') : '', videos.length ? plural(videos.length, 'film') : ''].filter(Boolean).join(' · '),
      heroMetaAlign: s.isMobile ? 'flex-start' : 'flex-end', heroMetaText: s.isMobile ? 'left' : 'right',
      navFilms: videos.length > 0 && nPhotos > 0,
      jump: e => {
        e.preventDefault();
        const el = document.getElementById('films');
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      },
      lightboxCounter: String(s.lightboxIndex + 1).padStart(dg, '0') + ' / ' + String(nMedia).padStart(dg, '0'),
      hasLightboxName: !!(current && current.name && current.name.trim()),
      // Swipe between items on touch; a drag that starts on the film is its scrubber's.
      stageRef: el => {
        if (!el || el._sw) return;
        el._sw = 1;
        let x0 = null, y0 = 0;
        el.addEventListener('touchstart', e => { if (e.target && e.target.tagName === 'VIDEO') { x0 = null; return; } const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
        el.addEventListener('touchend', e => {
          if (x0 == null) return;
          const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
          x0 = null;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) this.step(dx < 0 ? 1 : -1);
        }, { passive: true });
      },
      showSlideshowBtn: !isVideoItem,
      fullscreenLabel: s.isFullscreen ? 'exit full screen' : 'full screen',
      toggleFullscreen: () => this.toggleFullscreen(),
      // One video sits alone full-width; 2+ share a row (2 on mobile, 3 on desktop).
      videoCols: videos.length === 1
        ? 'minmax(0,1fr)'
        : 'repeat(' + Math.min(videos.length, s.isMobile ? 2 : 3) + ', minmax(0,1fr))',
      share: () => this.share(), shareLabel: s.shareLabel,
      setCoverRef: el => {
        if (!el || !s.event) return;
        // The hero carries the album — it always gets the highest-quality file we
        // have, on every device. No downscaled tier, no srcset negotiation.
        const full = s.event.cover_url_view || s.event.cover_url;
        if (!full) return;
        el.fetchPriority = 'high';
        el.decoding = 'sync';
        if (el.getAttribute('src') !== full) el.src = full;
        el.style.display = 'block';
      },

      lightboxOpen: s.lightboxOpen,
      lightboxName: current ? (current.name || '') : '',
      isVideoItem,
      lightboxImgSrc: current && !isVideoItem ? (current.url_view || current.url) : '',
      setLightboxImgRef: el => {
        const u = current && !isVideoItem && (current.url_view || current.url);
        if (!el || !u || el.getAttribute('src') === u) return;
        el.style.opacity = '0';
        el.onload = el.onerror = () => { el.style.opacity = '1'; };
        el.src = u;
      },
      hasImgSrc: !!(current && !isVideoItem && current.url),
      setLightboxVideoRef: el => {
        this.lightboxVideoEl = el;
        if (!el || !current || !current.url) return;
        if (el.src !== current.url) {
          el.preload = 'auto';
          if (current.thumb_url) el.poster = current.thumb_url;
          el.src = current.url;
          // The lightbox only opens from a tap, so that gesture buys us sound —
          // start at full volume and fall back to muted only if a browser refuses.
          el.muted = false;
          el.volume = 1;
          const p = el.play();
          if (p && p.catch) p.catch(() => {
            el.muted = true;
            const q = el.play();
            if (q && q.catch) q.catch(() => {});
          });
        }
      },
      prevItem: () => this.step(-1), nextItem: () => this.step(1),
      closeLightbox: () => this.closeLightbox(),
      toggleSlideshow: () => this.toggleSlideshow(),
      slideshowLabel: s.slideshowPlaying ? 'pause' : 'slideshow',
      downloadCurrent: () => this.downloadCurrent(),
      loaderOn: !s.loaderGone,
      loaderRef: this.loaderRef, loadNumRef: this.loadNumRef, loadBarRef: this.loadBarRef, loadLabelRef: this.loadLabelRef, loadMarkRef: this.loadMarkRef,
      shareCurrent: () => this.shareCurrent(),
    };
  }
}

</script>
</body>
</html>
