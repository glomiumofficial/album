<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creative INFINITELY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --green:#10AF8B; --green-deep:#0A6E58; }
  * { box-sizing:border-box; }
  body { margin:0; background:#FFFFFF; color:#16231F; font-family:'Jost',Helvetica,sans-serif; overflow-x:hidden; }
  a { color:var(--green); text-decoration:none; }
  ::selection { background:var(--green); color:#fff; }
</style>
</helmet>

<div style="position:relative; width:100%; background:#FFFFFF">

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="min-height:100vh; display:grid; place-items:center">
      <span style="font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--green-deep)">Loading album…</span>
    </div>
  </sc-if>

  <sc-if value="{{ notFound }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center">
      <div style="display:flex; flex-direction:column; gap:10px">
        <span style="font-size:20px; font-weight:300; color:var(--green)">Album not found</span>
        <span style="font-size:14px; color:#7C8985">Check the link and try again.</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasEvent }}" hint-placeholder-val="{{ false }}">
    <div>
      <div data-el="topbar" style="position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:16px clamp(18px,4vw,40px); opacity:0; pointer-events:none; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-bottom:1px solid rgba(16,175,139,.14); transition:opacity .3s">
        <span style="font-size:13px; font-weight:400; color:#16231F">{{ event.couple_names }}</span>
        <button onClick="{{ share }}" style="padding:9px 16px; background:#fff; color:var(--green-deep); border:1px solid var(--green); border-radius:2px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer" style-hover="background:var(--green); color:#fff">{{ shareLabel }}</button>
      </div>

      <div style="position:relative; height:100vh; height:100svh; overflow:hidden; background:#111">
<img ref="{{ setCoverRef }}" alt="{{ event.couple_names }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none">
        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.32) 0%, rgba(0,0,0,.05) 30%, rgba(0,0,0,.05) 60%, rgba(0,0,0,.5) 100%)"></div>
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:0 24px">
          <span style="font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:#EAF5F1">Infinitely</span>
          <h1 style="margin:0; font-size:clamp(30px,7vw,64px); font-weight:200; letter-spacing:.01em; color:#FFFFFF; text-wrap:balance">{{ event.couple_names }}</h1>
          <span style="font-size:clamp(13px,1.6vw,16px); letter-spacing:.08em; color:#DDEDE7">{{ dateLabel }}</span>
          <sc-if value="{{ event.venue }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:13px; letter-spacing:.06em; color:#C7DED6">{{ event.venue }}</span>
          </sc-if>
        </div>
        <div style="position:absolute; left:50%; bottom:28px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px">
          <span style="font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:#EAF5F1">Scroll</span>
          <div style="width:1px; height:30px; background:linear-gradient(180deg,#EAF5F1,transparent)"></div>
        </div>
      </div>

      <div style="position:relative">
        <div style="position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; display:flex; align-items:center; justify-content:center">
          <span style="font-size:clamp(90px,22vw,340px); font-weight:200; letter-spacing:.02em; color:var(--green); opacity:.1; filter:blur(6px); white-space:nowrap; text-transform:uppercase">INFINITELY</span>
        </div>
        <div style="position:relative; z-index:1; padding:clamp(28px,6vh,64px) 0; display:flex; flex-direction:column; gap:6px; width:100%">
        <sc-for list="{{ blocks }}" as="block" hint-placeholder-count="3">
          <sc-if value="{{ block.isGrid }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; gap:6px; padding:0 6px; align-items:flex-start">
              <sc-for list="{{ block.columns }}" as="col" hint-placeholder-count="3">
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px">
                  <sc-for list="{{ col.items }}" as="ph" hint-placeholder-count="2">
                    <div onClick="{{ ph.openLightbox }}" style="display:block; border-radius:1px; overflow:hidden; cursor:pointer">
                      <img ref="{{ ph.setImgRef }}" alt="{{ ph.name }}" loading="lazy" style="width:100%; display:block">
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ block.isFull }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ block.openLightbox }}" style="display:block; width:100%; cursor:pointer">
              <img ref="{{ block.setImgRef }}" alt="{{ block.name }}" loading="lazy" style="width:100%; max-height:92vh; object-fit:cover; display:block">
            </div>
          </sc-if>
        </sc-for>

        <sc-if value="{{ hasVideos }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; align-items:center; gap:clamp(38px,7vh,72px); padding:clamp(56px,10vh,110px) 6px clamp(20px,4vh,40px)">
            <div style="width:clamp(140px,26vw,260px); height:1px; background:linear-gradient(90deg, rgba(16,175,139,0) 0%, var(--green) 50%, rgba(16,175,139,0) 100%)"></div>
            <div style="width:100%; max-width:1480px; display:grid; gap:clamp(18px,2.4vw,34px); grid-template-columns:{{ videoCols }}">
              <sc-for list="{{ videos }}" as="vd" hint-placeholder-count="2">
                <div style="display:flex; flex-direction:column; gap:14px">
                  <video ref="{{ vd.setVideoRef }}" controls="{{ true }}" playsinline="{{ true }}" preload="metadata" style="width:100%; border-radius:2px; background:#000; display:block"></video>
                  <sc-if value="{{ vd.hasLabel }}" hint-placeholder-val="{{ false }}">
                    <span style="font-size:clamp(9px,1.1vw,11px); letter-spacing:.24em; text-transform:uppercase; color:var(--green-deep); text-align:center">{{ vd.label }}</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>
        </div>
      </div>

      <footer style="display:flex; flex-direction:column; align-items:center; gap:18px; padding:60px 24px 70px; border-top:1px solid rgba(16,175,139,.16)">
        <span style="font-size:13px; letter-spacing:.1em; color:var(--green-deep)">{{ event.couple_names }} · {{ dateLabel }}</span>
        <button onClick="{{ share }}" style="padding:12px 26px; background:#fff; color:var(--green-deep); border:1px solid var(--green); border-radius:2px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer" style-hover="background:var(--green); color:#fff">{{ shareLabel }}</button>
        <span style="font-size:10px; letter-spacing:.2em; color:#9AA6A2"><span style="text-transform:lowercase">creative</span> <span style="color:var(--green-deep); text-transform:uppercase">INFINITELY</span></span>
      </footer>
    </div>
  </sc-if>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; z-index:1000; background:rgba(10,14,13,.97); display:flex; flex-direction:column">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px clamp(16px,4vw,36px); flex-wrap:wrap; gap:10px">
        <span style="font-size:13px; color:#EAF5F1; letter-spacing:.04em; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ lightboxName }}</span>
        <div style="display:flex; gap:10px; align-items:center">
          <button onClick="{{ toggleSlideshow }}" style="padding:9px 14px; background:transparent; color:#EAF5F1; border:1px solid rgba(255,255,255,.3); border-radius:2px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer" style-hover="border-color:var(--green); color:var(--green)">{{ slideshowLabel }}</button>
          <button onClick="{{ shareCurrent }}" style="padding:9px 14px; background:transparent; color:#EAF5F1; border:1px solid rgba(255,255,255,.3); border-radius:2px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer" style-hover="border-color:var(--green); color:var(--green)">Share</button>
          <button onClick="{{ downloadCurrent }}" style="padding:9px 14px; background:#fff; color:var(--green-deep); border:1px solid var(--green); border-radius:2px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer" style-hover="background:var(--green); color:#fff">Download</button>
          <button onClick="{{ closeLightbox }}" style="padding:9px 12px; background:transparent; color:#EAF5F1; border:1px solid rgba(255,255,255,.3); border-radius:2px; font-size:14px; cursor:pointer" style-hover="border-color:var(--green); color:var(--green)">✕</button>
        </div>
      </div>
      <div style="flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:0 clamp(8px,3vw,40px) clamp(16px,3vh,40px); min-height:0">
        <button onClick="{{ prevItem }}" style="position:absolute; left:clamp(4px,1.5vw,24px); top:50%; transform:translateY(-50%); background:transparent; border:none; color:#EAF5F1; font-size:30px; cursor:pointer; padding:10px; opacity:.7" style-hover="opacity:1; color:var(--green)">‹</button>
        <sc-if value="{{ isVideoItem }}" hint-placeholder-val="{{ false }}">
          <video ref="{{ setLightboxVideoRef }}" controls="{{ true }}" autoPlay="{{ true }}" playsinline="{{ true }}" style="max-width:100%; max-height:100%; border-radius:2px; background:#000"></video>
        </sc-if>
        <sc-if value="{{ hasImgSrc }}" hint-placeholder-val="{{ false }}">
          <img ref="{{ setLightboxImgRef }}" alt="{{ lightboxName }}" style="max-width:100%; max-height:100%; object-fit:contain">
        </sc-if>
        <button onClick="{{ nextItem }}" style="position:absolute; right:clamp(4px,1.5vw,24px); top:50%; transform:translateY(-50%); background:transparent; border:none; color:#EAF5F1; font-size:30px; cursor:pointer; padding:10px; opacity:.7" style-hover="opacity:1; color:var(--green)">›</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SUPABASE_URL = 'https://gpyyxvnymmwhpdmijyvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oesyTPK2JuS1G20t8vS0zw_Yp9bgwd1';

class Component extends DCLogic {
  state = {
    loading: true, notFound: false, event: null, media: [], shareLabel: 'Share album',
    lightboxOpen: false, lightboxIndex: 0, slideshowPlaying: false,
    isMobile: typeof window !== 'undefined' ? window.innerWidth < 768 : false,
    videoShareId: null,
  };

  onResize = () => {
    const m = window.innerWidth < 768;
    if (m !== this.state.isMobile) this.setState({ isMobile: m });
  };

  componentDidMount() {
    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('resize', this.onResize);
    // helmet's static <title> lands on stream completion, which can be after
    // mount — re-assert once the frame settles so JS wins.
    this.syncTitle();
    requestAnimationFrame(() => this.syncTitle());
    setTimeout(() => this.syncTitle(), 400);
    const slug = new URLSearchParams(window.location.search).get('event');
    if (!slug) { this.setState({ loading: false, notFound: true }); return; }
    this.load(slug);
  }

  // Single source of truth for the tab title. The <helmet> title is a static
  // literal, injected on stream completion; this runs after that and on every
  // update, so the event name always wins once it loads.
  syncTitle() {
    const e = this.state.event;
    const t = e && e.couple_names ? 'creative INFINITELY — ' + e.couple_names : 'creative INFINITELY';
    if (document.title !== t) document.title = t;
  }

  componentDidUpdate() { this.syncTitle(); }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('resize', this.onResize);
    this.stopSlideshow();
  }

  onScroll = () => {
    const bar = document.querySelector('[data-el="topbar"]');
    if (!bar) return;
    const past = window.scrollY > window.innerHeight * 0.85;
    bar.style.opacity = past ? '1' : '0';
    bar.style.pointerEvents = past ? 'auto' : 'none';
  };

  onKeyDown = (e) => {
    if (!this.state.lightboxOpen) return;
    if (e.key === 'Escape') this.closeLightbox();
    if (e.key === 'ArrowLeft') this.step(-1);
    if (e.key === 'ArrowRight') this.step(1);
  };

  async load(slug) {
    try {
      const { data: ev, error } = await this.sb.from('events').select('*').eq('slug', slug).maybeSingle();
      if (error || !ev) { this.setState({ loading: false, notFound: true }); return; }
      const { data: media, error: mErr } = await this.sb.from('media').select('*').eq('event_id', ev.id).order('sort_order', { ascending: true });
      if (mErr) { this.setState({ loading: false, notFound: true }); return; }
      this.setState({ loading: false, event: ev, media: (media || []).filter(m => m.url) });
    } catch (e) { this.setState({ loading: false, notFound: true }); }
  }

  share() {
    const url = window.location.href;
    if (navigator.share) { navigator.share({ title: this.state.event.couple_names, url }).catch(() => {}); return; }
    navigator.clipboard.writeText(url).then(() => {
      this.setState({ shareLabel: 'Link copied!' });
      setTimeout(() => this.setState({ shareLabel: 'Share album' }), 1800);
    });
  }

  openLightbox(idx) { this.setState({ lightboxOpen: true, lightboxIndex: idx }); }
  closeLightbox() { this.stopSlideshow(); this.setState({ lightboxOpen: false }); }

  step(dir) {
    const n = this.state.media.length;
    if (!n) return;
    this.setState({ lightboxIndex: (this.state.lightboxIndex + dir + n) % n });
  }

  toggleSlideshow() {
    if (this.state.slideshowPlaying) { this.stopSlideshow(); return; }
    this.setState({ slideshowPlaying: true });
    this.slideTimer = setInterval(() => this.step(1), 3000);
  }
  stopSlideshow() {
    if (this.slideTimer) { clearInterval(this.slideTimer); this.slideTimer = null; }
    if (this.state.slideshowPlaying) this.setState({ slideshowPlaying: false });
  }

  // Cross-origin hrefs ignore the download attribute, so fetch to a Blob and
  // click a same-origin object URL instead.
  async downloadUrl(url, name) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const obj = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = obj; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(obj), 4000);
    } catch (e) { window.open(url, '_blank'); }
  }

  async downloadCurrent() {
    const item = this.state.media[this.state.lightboxIndex];
    if (!item) return;
    const name = item.name || item.url.split('/').pop().split('?')[0];
    try {
      const res = await fetch(item.url);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) { window.open(item.url, '_blank'); }
  }

  shareCurrent() {
    const item = this.state.media[this.state.lightboxIndex];
    if (!item) return;
    if (navigator.share) { navigator.share({ title: item.name || this.state.event.couple_names, url: item.url }).catch(() => {}); return; }
    navigator.clipboard.writeText(item.url);
  }

  renderVals() {
    const s = this.state;
    const fmtDate = d => { if (!d) return ''; const t = new Date(d + 'T00:00:00'); return isNaN(t.getTime()) ? '' : t.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); };

    const indexed = s.media.map((m, i) => ({ ...m, idx: i }));
    const blocks = [];
    let run = [];
    const flush = () => {
      if (run.length) {
        const items = run.map(ph => ({
          ...ph,
          setImgRef: el => { const g = ph.url_grid || ph.url, v = ph.url_view || ph.url; if (el && g) { el.src = g; if (v && v !== g) el.srcset = g + ' 1200w, ' + v + ' 2800w'; el.sizes = this.state.isMobile ? '33vw' : '25vw'; } },
          openLightbox: () => this.openLightbox(ph.idx),
        }));
        const numCols = Math.min(this.state.isMobile ? 3 : 4, Math.max(2, items.length));
        const cols = Array.from({ length: Math.min(numCols, items.length) || 1 }, () => []);
        items.forEach((it, i) => cols[i % cols.length].push(it));
        blocks.push({ isGrid: true, isFull: false, isVideo: false, columns: cols.map(colItems => ({ items: colItems })) });
        run = [];
      }
    };
    for (const m of indexed) {
      if (m.kind === 'video') continue;
      if (m.full_bleed) {
        flush();
        blocks.push({ isGrid: false, isFull: true, isVideo: false, item: m, name: m.name || '', setImgRef: el => { const u = m.url_view || m.url; if (el && u) el.src = u; }, openLightbox: () => this.openLightbox(m.idx) });
      } else run.push(m);
    }
    flush();

    // Videos always sit below the full photo grid, in their own labelled section.
    const videos = indexed.filter(m => m.kind === 'video').map(m => ({
      ...m,
      label: m.name || '',
      hasLabel: !!(m.name && m.name.trim()),
      downloadVideo: () => {
        const src = m.url.split('?')[0];
        const ext = (src.split('.').pop() || 'mp4').toLowerCase();
        const safeExt = /^[a-z0-9]{2,5}$/.test(ext) ? ext : 'mp4';
        const base = (m.name || 'film').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'film';
        this.downloadUrl(m.url, base + '.' + safeExt);
      },
      shareVideo: async () => {
        const title = (m.name || 'Film') + ' — ' + ((s.event && s.event.couple_names) || 'Album');
        try {
          if (navigator.share) { await navigator.share({ title, url: m.url }); return; }
          await navigator.clipboard.writeText(m.url);
          this.setState({ videoShareId: m.id });
          setTimeout(() => this.setState({ videoShareId: null }), 1800);
        } catch (e) {}
      },
      shareLabel: s.videoShareId === m.id ? 'Link copied' : 'Share',
      setVideoRef: el => {
        if (!el || !m.url) return;
        el.src = m.url;
        // Fit each film to its own frame — vertical reels stay vertical instead of
        // sitting letterboxed inside a wide black box.
        const fit = () => {
          const w = el.videoWidth, h = el.videoHeight;
          if (!w || !h) return;
          el.style.aspectRatio = w + ' / ' + h;
          el.style.width = '100%';
          el.style.height = 'auto';
        };
        el.addEventListener('loadedmetadata', fit);
        if (el.readyState >= 1) fit();
      },
    }));

    const current = s.media[s.lightboxIndex] || null;
    const isVideoItem = !!(current && current.kind === 'video');

    return {
      loading: s.loading, notFound: s.notFound, hasEvent: !!s.event,
      pageTitle: s.event ? s.event.couple_names + ' — Infinitely' : 'Infinitely — Glomium',
      event: s.event || {}, dateLabel: s.event ? fmtDate(s.event.event_date) : '',
      blocks, videos, hasVideos: videos.length > 0,
      // One video sits alone full-width; 2+ share a row (2 on mobile, 3 on desktop).
      videoCols: videos.length === 1
        ? 'minmax(0,1fr)'
        : 'repeat(' + Math.min(videos.length, s.isMobile ? 2 : 3) + ', minmax(0,1fr))',
      share: () => this.share(), shareLabel: s.shareLabel,
      setCoverRef: el => { const u = s.event && (s.event.cover_url_view || s.event.cover_url); if (el && u) { el.src = u; el.style.display = 'block'; } },

      lightboxOpen: s.lightboxOpen,
      lightboxName: current ? (current.name || '') : '',
      isVideoItem,
      lightboxImgSrc: current && !isVideoItem ? (current.url_view || current.url) : '',
      setLightboxImgRef: el => { const u = current && !isVideoItem && (current.url_view || current.url); if (el && u) el.src = u; },
      hasImgSrc: !!(current && !isVideoItem && current.url),
      setLightboxVideoRef: el => { if (el && current && current.url) el.src = current.url; },
      prevItem: () => this.step(-1), nextItem: () => this.step(1),
      closeLightbox: () => this.closeLightbox(),
      toggleSlideshow: () => this.toggleSlideshow(),
      slideshowLabel: s.slideshowPlaying ? 'Pause' : 'Slideshow',
      downloadCurrent: () => this.downloadCurrent(),
      shareCurrent: () => this.shareCurrent(),
    };
  }
}

</script>
</body>
</html>
