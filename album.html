<body>

<template id="dc-src">
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creative INFINITELY</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
  :root { --green:#10AF8B; --green-deep:#0A6E58; --ink:#1B1D1E; }
  * { box-sizing:border-box; }
  body { margin:0; background:#FFFFFF; color:#1B1D1E; font-family:'Jost',Helvetica,sans-serif; font-weight:300; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  a { color:#0A6E58; text-decoration:none; }
  a:hover { color:#10AF8B; }
  button { font-family:inherit; }
  ::selection { background:#10AF8B; color:#fff; }
</style>
</helmet>

<div style="position:relative; width:100%; background:#FFFFFF">

  <sc-if value="{{ notFound }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between; gap:48px; padding:22px clamp(20px,4vw,56px) clamp(28px,5vh,48px)">
      <img src="assets/wordmark-green.png" alt="glomium" style="height:20px; width:auto; align-self:flex-start">
      <div style="display:flex; flex-direction:column; gap:22px; max-width:40em">
        <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">404</span>
        <h1 style="margin:0; font-size:clamp(44px,8vw,140px); font-weight:200; line-height:.94; letter-spacing:-0.035em; color:#1B1D1E">album <span style="font-style:italic; color:#10AF8B">not</span> found</h1>
        <p style="margin:0; font-size:16px; line-height:1.8; color:#4A524F">check the link and try again.</p>
      </div>
      <span style="font-size:11px; letter-spacing:2.6px; color:#8A9390">creative INFINITELY</span>
    </div>
  </sc-if>

  <sc-if value="{{ hasLoadError }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between; gap:48px; padding:22px clamp(20px,4vw,56px) clamp(28px,5vh,48px)">
      <img src="assets/wordmark-green.png" alt="glomium" style="height:20px; width:auto; align-self:flex-start">
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:22px; max-width:40em">
        <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">your album</span>
        <h1 style="margin:0; font-size:clamp(44px,8vw,140px); font-weight:200; line-height:.94; letter-spacing:-0.035em; color:#1B1D1E">it didn’t <span style="font-style:italic; color:#10AF8B">load</span></h1>
        <p style="margin:0; max-width:30em; font-size:16px; line-height:1.8; color:#4A524F; text-wrap:pretty">{{ loadError }}</p>
        <button onClick="{{ retry }}" style="margin-top:6px; min-height:44px; padding:14px 24px; background:none; border:1px solid #0E8E72; border-radius:0; font-size:10px; letter-spacing:3.4px; text-transform:uppercase; color:#0E8E72; cursor:pointer; transition:background .3s, color .3s" style-hover="background:#0E8E72; color:#FFFFFF">try again</button>
      </div>
      <span style="font-size:11px; letter-spacing:2.6px; color:#8A9390">creative INFINITELY</span>
    </div>
  </sc-if>

  <sc-if value="{{ hasGate }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between; gap:48px; padding:22px clamp(20px,4vw,56px) clamp(28px,5vh,48px)">
      <img src="assets/wordmark-green.png" alt="glomium" style="height:20px; width:auto; align-self:flex-start">
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:22px; max-width:40em">
        <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">{{ gateKicker }}</span>
        <h1 style="margin:0; font-size:clamp(40px,7vw,120px); font-weight:200; line-height:.94; letter-spacing:-0.035em; color:#1B1D1E; text-wrap:balance">{{ gateNames }}</h1>
        <p style="margin:0; max-width:30em; font-size:16px; line-height:1.8; font-weight:300; color:#4A524F; text-wrap:pretty">{{ gateLine }}</p>
        <sc-if value="{{ gateAsksPin }}" hint-placeholder-val="{{ false }}">
          <form onSubmit="{{ submitPin }}" style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
            <input value="{{ pinValue }}" onChange="{{ onPin }}" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="····" aria-label="4-digit pin" style="width:150px; min-height:48px; padding:12px 16px; border:1px solid #DDE3E1; border-radius:0; font:inherit; font-size:22px; letter-spacing:.5em; color:#1B1D1E; outline:none; background:#FFFFFF" style-focus="border-color:#0E8E72">
            <button type="submit" disabled="{{ pinBusy }}" style="min-height:48px; padding:14px 24px; background:none; border:1px solid #0E8E72; border-radius:0; font-size:10px; letter-spacing:3.4px; text-transform:uppercase; color:#0E8E72; cursor:pointer; transition:background .3s, color .3s" style-hover="background:#0E8E72; color:#FFFFFF">{{ pinBtn }}</button>
          </form>
        </sc-if>
        <sc-if value="{{ hasGateNote }}" hint-placeholder-val="{{ false }}">
          <span style="font-size:13px; color:{{ gateNoteColor }}">{{ gateNote }}</span>
        </sc-if>
      </div>
      <span style="font-size:11px; letter-spacing:2.6px; color:#8A9390">creative INFINITELY</span>
    </div>
  </sc-if>

  <sc-if value="{{ hasEvent }}" hint-placeholder-val="{{ false }}">
    <div>
      <div data-el="topbar" style="position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:6px clamp(20px,4vw,56px); opacity:0; pointer-events:none; background:#FFFFFF; border-bottom:1px solid #EEF1F0; transition:opacity .4s">
        <span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; color:#1B1D1E">{{ event.couple_names }}</span>
        <div style="display:flex; align-items:center; gap:clamp(20px,3vw,36px); font-size:10px; letter-spacing:2.6px; text-transform:uppercase; white-space:nowrap">
          <sc-if value="{{ navFilms }}" hint-placeholder-val="{{ false }}">
            <a href="#films" onClick="{{ jump }}" style="display:flex; align-items:center; min-height:44px; color:#1B1D1E" style-hover="color:#10AF8B">films</a>
          </sc-if>
          <sc-if value="{{ hasChapterNav }}" hint-placeholder-val="{{ false }}">
            <a href="#photos" onClick="{{ jumpChapters }}" style="display:flex; align-items:center; min-height:44px; color:#1B1D1E" style-hover="color:#10AF8B">chapters</a>
          </sc-if>
          <button onClick="{{ share }}" style="min-height:44px; padding:0; border:0; background:none; font:inherit; letter-spacing:inherit; text-transform:inherit; color:#0A6E58; cursor:pointer" style-hover="color:#10AF8B">{{ shareLabel }}</button>
        </div>
      </div>

      <div style="position:relative; height:100vh; height:100svh; overflow:hidden; background:#0B0C0C">
        <img ref="{{ setCoverRef }}" data-cover="" alt="{{ event.couple_names }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none">
        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,22,17,.36) 0%, rgba(8,22,17,0) 22%, rgba(8,22,17,0) 46%, rgba(8,22,17,.62) 100%)"></div>
        <div style="position:absolute; top:0; left:0; right:0; display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:12px clamp(20px,4vw,56px)">
          <img src="assets/wordmark-white.png" alt="glomium" style="height:20px; width:auto; display:block">
          <button onClick="{{ share }}" style="min-height:44px; padding:0; border:0; background:none; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#FFFFFF; cursor:pointer" style-hover="color:#BFE9DC">{{ shareLabel }}</button>
        </div>
        <div style="position:absolute; left:clamp(20px,4vw,56px); right:clamp(20px,4vw,56px); bottom:clamp(36px,7vh,72px); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:22px 48px; color:#FFFFFF">
          <div style="display:flex; flex-direction:column; gap:18px; min-width:0; max-width:100%">
            <sc-if value="{{ hasDate }}" hint-placeholder-val="{{ false }}"><span data-rise="" style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase">{{ dateLabel }}</span></sc-if>
            <h1 data-rise="" style="margin:0; font-size:clamp(44px,8.4vw,156px); font-weight:200; line-height:.94; letter-spacing:-0.035em; text-wrap:balance; overflow-wrap:anywhere">{{ event.couple_names }}</h1>
          </div>
          <div data-rise="" style="display:flex; flex-direction:column; align-items:{{ heroMetaAlign }}; gap:12px; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; text-align:{{ heroMetaText }}">
            <sc-if value="{{ hasVenue }}" hint-placeholder-val="{{ false }}"><span>{{ event.venue }}</span></sc-if>
            <span>{{ countLabel }}</span>
          </div>
        </div>
      </div>

      <section id="photos" style="padding:clamp(96px,12vw,180px) clamp(20px,4vw,56px) 0">
        <sc-if value="{{ hasPhotos }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; gap:22px; margin-bottom:clamp(40px,5vw,72px)">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:24px; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">
              <span>{{ photosHead }}</span>
              <div style="display:flex; align-items:baseline; gap:clamp(16px,3vw,32px)">
                <sc-if value="{{ hasAllDl }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ allDl }}" style="min-height:44px; padding:0; border:0; background:none; font:inherit; letter-spacing:inherit; text-transform:inherit; color:#0A6E58; cursor:pointer" style-hover="color:#1B1D1E">{{ allDlLabel }}</button>
                </sc-if>
                <sc-if value="{{ hasFavs }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ toggleFavOnly }}" style="min-height:44px; padding:0; border:0; background:none; font:inherit; letter-spacing:inherit; text-transform:inherit; color:{{ favChipColor }}; cursor:pointer" style-hover="color:#10AF8B">{{ favChipLabel }}</button>
                </sc-if>
                <span style="font-variant-numeric:tabular-nums">{{ photoCount }}</span>
              </div>
            </div>
            <sc-if value="{{ hasChapterNav }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; gap:clamp(18px,3vw,36px); overflow-x:auto; padding-bottom:4px; border-top:1px solid #EEF1F0; padding-top:14px">
                <sc-for list="{{ chapterNav }}" as="cn" hint-placeholder-count="3">
                  <a href="{{ cn.href }}" onClick="{{ cn.go }}" style="display:flex; align-items:baseline; gap:8px; min-height:44px; white-space:nowrap; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#1B1D1E" style-hover="color:#10AF8B"><span style="color:#8A9390; font-variant-numeric:tabular-nums">{{ cn.no }}</span>{{ cn.title }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <div style="display:flex; flex-direction:column; gap:clamp(72px,9vw,140px)">
          <sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="1">
          <div id="{{ ch.anchor }}" style="display:flex; flex-direction:column; gap:clamp(10px,1.4vw,20px); scroll-margin-top:96px">
            <sc-if value="{{ ch.hasTitle }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:16px 32px; margin-bottom:clamp(14px,2vw,28px)">
                <div style="display:flex; flex-direction:column; gap:10px; min-width:0">
                  <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390; font-variant-numeric:tabular-nums">{{ ch.no }} · {{ ch.countLabel }}</span>
                  <h2 style="margin:0; font-size:clamp(30px,4.4vw,68px); font-weight:200; line-height:1; letter-spacing:-0.03em; color:#1B1D1E; overflow-wrap:anywhere">{{ ch.title }}</h2>
                </div>
                <button onClick="{{ ch.download }}" disabled="{{ ch.busy }}" style="min-height:44px; padding:0; border:0; background:none; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#0A6E58; cursor:pointer" style-hover="color:#1B1D1E">{{ ch.dlLabel }}</button>
              </div>
            </sc-if>
            <sc-for list="{{ ch.blocks }}" as="block" hint-placeholder-count="2">
            <sc-if value="{{ block.isGrid }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; gap:clamp(10px,1.4vw,20px); align-items:flex-start; width:{{ block.width }}; margin:0 auto">
                <sc-for list="{{ block.columns }}" as="col" hint-placeholder-count="3">
                  <div style="flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:clamp(10px,1.4vw,20px)">
                    <sc-for list="{{ col.items }}" as="ph" hint-placeholder-count="2">
                      <button onClick="{{ ph.openLightbox }}" aria-label="{{ ph.aria }}" style="position:relative; display:block; width:100%; padding:0; border:0; background:#F1F4F3; overflow:hidden; cursor:zoom-in">
                        <img ref="{{ ph.setImgRef }}" alt="{{ ph.name }}" loading="lazy" decoding="async" style="width:100%; display:block; transition:opacity .8s, transform 1.4s cubic-bezier(.2,.8,.2,1)" style-hover="transform:scale(1.025)">
                        <sc-if value="{{ ph.isFav }}" hint-placeholder-val="{{ false }}">
                          <span aria-label="favourite" style="position:absolute; top:10px; right:10px; display:flex; align-items:center; justify-content:center; width:28px; height:28px; background:#FFFFFF; color:#0E8E72; font-size:14px; line-height:1">♥</span>
                        </sc-if>
                      </button>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ block.isFull }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ block.openLightbox }}" aria-label="{{ block.aria }}" style="display:block; width:calc(100% + 2 * clamp(20px,4vw,56px)); margin:clamp(34px,5vw,84px) calc(-1 * clamp(20px,4vw,56px)); padding:0; border:0; background:#F1F4F3; overflow:hidden; cursor:zoom-in">
                <img ref="{{ block.setImgRef }}" alt="{{ block.name }}" loading="lazy" decoding="async" style="width:100%; max-height:92vh; object-fit:cover; display:block; transition:opacity .8s">
              </button>
            </sc-if>
            </sc-for>
          </div>
          </sc-for>
          <sc-if value="{{ favOnlyEmpty }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:16px; line-height:1.8; font-weight:300; color:#4A524F">no favourites yet — open a photo and tap favourite.</span>
          </sc-if>
        </div>

        <sc-if value="{{ hasVideos }}" hint-placeholder-val="{{ false }}">
          <div id="films" style="display:flex; flex-direction:column; gap:clamp(40px,5vw,72px); padding-top:{{ filmsTop }}">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:24px; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">
              <span>{{ filmsHead }}</span>
              <span style="font-variant-numeric:tabular-nums">{{ filmCount }}</span>
            </div>
            <div style="display:grid; gap:clamp(44px,5vw,72px) clamp(14px,1.8vw,28px); grid-template-columns:{{ videoCols }}; align-items:start">
              <sc-for list="{{ videos }}" as="vd" hint-placeholder-count="2">
                <button onClick="{{ vd.open }}" aria-label="play {{ vd.title }}" style="display:flex; flex-direction:column; gap:16px; min-width:0; padding:0; border:0; background:none; text-align:left; color:inherit; cursor:pointer">
                  <div style="position:relative; width:100%; overflow:hidden; background:#0B0C0C">
                    <video ref="{{ vd.setVideoRef }}" muted="{{ true }}" playsinline="{{ true }}" preload="metadata" tabIndex="-1" style="width:100%; aspect-ratio:16 / 9; object-fit:cover; display:block; pointer-events:none"></video>
                  </div>
                  <div style="width:100%; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 20px">
                    <div style="display:flex; gap:14px; align-items:baseline; min-width:0">
                      <span style="font-size:10px; letter-spacing:2.6px; color:#10AF8B; font-variant-numeric:tabular-nums">{{ vd.no }}</span>
                      <span style="font-size:19px; line-height:1.35; color:#1B1D1E">{{ vd.title }}</span>
                    </div>
                    <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#0A6E58">play</span>
                  </div>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </section>

      <footer style="display:flex; flex-direction:column; align-items:center; gap:26px; padding:clamp(140px,16vw,240px) clamp(20px,4vw,56px) 110px; text-align:center">
        <sc-if value="{{ hasFooterMeta }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">{{ footerMeta }}</span></sc-if>
        <h2 style="margin:0; font-size:clamp(34px,5vw,80px); font-weight:200; line-height:1; letter-spacing:-0.03em; color:#1B1D1E; text-wrap:balance">{{ event.couple_names }}</h2>
        <button onClick="{{ share }}" style="margin-top:8px; min-height:44px; padding:14px 24px; background:none; border:1px solid #0E8E72; border-radius:0; font-size:10px; letter-spacing:3.4px; text-transform:uppercase; color:#0E8E72; cursor:pointer; transition:background .3s, color .3s" style-hover="background:#0E8E72; color:#FFFFFF">{{ shareLabel }}</button>
        <img src="assets/infinity.svg" alt="" style="margin-top:clamp(72px,9vw,130px); width:clamp(80px,9vw,140px); height:auto">
        <div style="font-size:16px; line-height:1.8; color:#4A524F">with love,<br>team glomium.</div>
        <div style="width:48px; height:1px; background:#E2E7E5"></div>
        <div style="font-size:11px; letter-spacing:2.6px; color:#8A9390">creative INFINITELY</div>
      </footer>
    </div>
  </sc-if>

  <sc-if value="{{ loaderOn }}" hint-placeholder-val="{{ true }}">
    <div ref="{{ loaderRef }}" style="position:fixed; inset:0; z-index:1200; background:#FFFFFF; clip-path:inset(0% 0% 0% 0%); transition:clip-path 1.1s cubic-bezier(.77,0,.18,1); display:flex; flex-direction:column; justify-content:space-between; padding:22px clamp(20px,4vw,56px) clamp(28px,5vh,48px); overflow:hidden">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(62vw 62vw at 12% 8%, rgba(16,175,139,0.13), transparent 65%), radial-gradient(52vw 52vw at 92% 86%, rgba(16,175,139,0.08), transparent 65%)"></div>
      <div style="position:relative; display:flex; justify-content:space-between; align-items:baseline; gap:24px; font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">
        <img src="assets/wordmark-green.png" alt="glomium" style="height:20px; width:auto; display:block">
        <span>your album</span>
      </div>
      <div style="position:relative; display:flex; justify-content:center">
        <img ref="{{ loadMarkRef }}" src="assets/infinity.svg" alt="" style="width:clamp(72px,8vw,120px); height:auto">
      </div>
      <div style="position:relative; display:flex; flex-direction:column; gap:18px">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:24px">
          <span ref="{{ loadNumRef }}" style="font-weight:200; font-size:clamp(64px,12vw,200px); line-height:0.8; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; color:#1B1D1E">000</span>
          <span ref="{{ loadLabelRef }}" style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390; text-align:right">preparing your album</span>
        </div>
        <div style="position:relative; height:1px; background:#E2E7E5; overflow:hidden">
          <div ref="{{ loadBarRef }}" style="position:absolute; inset:0; background:#10AF8B; transform-origin:left; transform:scaleX(0)"></div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="viewer" style="position:fixed; inset:0; z-index:1000; background:#0B0C0C; display:flex; flex-direction:column; color:#FFFFFF; font-size:10px; letter-spacing:2.6px; text-transform:uppercase">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; padding:4px clamp(20px,4vw,56px)">
        <div style="display:flex; align-items:baseline; gap:16px; min-width:0">
          <span style="font-variant-numeric:tabular-nums; white-space:nowrap">{{ lightboxCounter }}</span>
          <sc-if value="{{ hasLightboxName }}" hint-placeholder-val="{{ false }}"><span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#A9B3B0">{{ lightboxName }}</span></sc-if>
        </div>
        <button onClick="{{ closeLightbox }}" style="min-height:44px; padding:0; border:0; background:none; font:inherit; letter-spacing:inherit; text-transform:inherit; color:#FFFFFF; cursor:pointer" style-hover="color:#10AF8B">close</button>
      </div>

  wireStallGuard(el) {

      filmsHead: (nPhotos ? '02' : '01') + ' — films', filmCount: String(videos.length),
      filmsTop: nPhotos ? 'clamp(120px,14vw,200px)' : '0px',
      countLabel: [nPhotos ? plural(nPhotos, 'photograph') : '', videos.length ? plural(videos.length, 'film') : ''].filter(Boolean).join(' · '),
      heroMetaAlign: s.isMobile ? 'flex-start' : 'flex-end', heroMetaText: s.isMobile ? 'left' : 'right',
      navFilms: videos.length > 0 && nPhotos > 0,
      jump: e => {
        e.preventDefault();
        const el = document.getElementById('films');
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      },
      lightboxCounter: String(s.lightboxIndex + 1).padStart(dg, '0') + ' / ' + String(nMedia).padStart(dg, '0'),
      hasLightboxName: !!(current && current.name && current.name.trim()),
      // Swipe between items on touch; a drag that starts on the film is its scrubber's.
      stageRef: el => {
        if (!el || el._sw) return;
        el._sw = 1;
        let x0 = null, y0 = 0;
        el.addEventListener('touchstart', e => { if (e.target && e.target.tagName === 'VIDEO') { x0 = null; return; } const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
        el.addEventListener('touchend', e => {
          if (x0 == null) return;
          const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
          x0 = null;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) this.step(dx < 0 ? 1 : -1);
        }, { passive: true });
      },
      showSlideshowBtn: !isVideoItem,
      fullscreenLabel: s.isFullscreen ? 'exit full screen' : 'full screen',
      toggleFullscreen: () => this.toggleFullscreen(),
      // One video sits alone full-width; 2+ share a row (2 on mobile, 3 on desktop).
      videoCols: videos.length === 1
        ? 'minmax(0,1fr)'
        : 'repeat(' + Math.min(videos.length, s.isMobile ? 2 : 3) + ', minmax(0,1fr))',
      share: () => this.share(), shareLabel: s.shareLabel,
      setCoverRef: el => {
        if (!el || !s.event) return;
        // The hero carries the album — it always gets the highest-quality file we
        // have, on every device. No downscaled tier, no srcset negotiation.
        const full = s.event.cover_url_view || s.event.cover_url;
        if (!full) return;
        el.fetchPriority = 'high';
        el.decoding = 'sync';
        if (el.getAttribute('src') !== full) el.src = full;
        el.style.display = 'block';
      },

      lightboxOpen: s.lightboxOpen,
      lightboxName: current ? (current.name || '') : '',
      isVideoItem,
      lightboxImgSrc: current && !isVideoItem ? (current.url_view || current.url) : '',
      setLightboxImgRef: el => {
        const u = current && !isVideoItem && (current.url_view || current.url);
        if (!el || !u || el.getAttribute('src') === u) return;
        el.style.opacity = '0';
        el.onload = el.onerror = () => { el.style.opacity = '1'; };
        el.src = u;
      },
      hasImgSrc: !!(current && !isVideoItem && current.url),
      setLightboxVideoRef: el => {
        this.lightboxVideoEl = el;
        if (!el || !current || !current.url) return;
        if (el.src !== current.url) {
          el.preload = 'auto';
          if (current.thumb_url) el.poster = current.thumb_url;
          el.src = current.url;
          // The lightbox only opens from a tap, so that gesture buys us sound —
          // start at full volume and fall back to muted only if a browser refuses.
          el.muted = false;
          el.volume = 1;
          const p = el.play();
          if (p && p.catch) p.catch(() => {
            el.muted = true;
            const q = el.play();
            if (q && q.catch) q.catch(() => {});
          });
        }
      },
      prevItem: () => this.step(-1), nextItem: () => this.step(1),
      closeLightbox: () => this.closeLightbox(),
      toggleSlideshow: () => this.toggleSlideshow(),
      slideshowLabel: s.slideshowPlaying ? 'pause' : 'slideshow',
      downloadCurrent: () => this.downloadCurrent(),
      loaderOn: !s.loaderGone,
      loaderRef: this.loaderRef, loadNumRef: this.loadNumRef, loadBarRef: this.loadBarRef, loadLabelRef: this.loadLabelRef, loadMarkRef: this.loadMarkRef,
      shareCurrent: () => this.shareCurrent(),
    };
  }
}

</script>
</body>
</html>
