<div style="min-height:100vh; display:flex; flex-direction:column; background:#FFFFFF">

  <sc-if value="{{ notPage }}" hint-placeholder-val="{{ true }}">

    <main style="flex:1; width:100%; max-width:1120px; margin:0 auto; padding:clamp(48px,8vw,104px) clamp(20px,4vw,56px) clamp(80px,10vw,140px); display:flex; flex-direction:column; gap:clamp(64px,9vw,120px)">

          <p style="margin:0; max-width:32em; font-size:16px; line-height:1.8; color:#4A524F; text-wrap:pretty">{{ deadNote }}</p>

      <sc-if value="{{ showGate }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:clamp(40px,6vw,64px); max-width:820px">
          <div style="display:flex; flex-direction:column; align-items:center; gap:clamp(22px,3vw,34px); width:100%; padding:clamp(40px,6.4vw,84px) 0 clamp(26px,3.4vw,40px); border-top:1px solid #E2E7E5; border-bottom:1px solid #E2E7E5">
            <div style="display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; column-gap:clamp(22px,5.4vw,80px); row-gap:clamp(14px,2vw,20px); width:100%">
              <div style="display:flex; justify-content:flex-end; min-width:0">

  <sc-if value="{{ showPage }}" hint-placeholder-val="{{ false }}">

      <div style="max-width:1232px; margin:0 auto; padding:0 clamp(20px,4vw,56px); display:flex; align-items:center; gap:0 32px; flex-wrap:wrap">

        </button>

    <div style="width:100%; max-width:1232px; margin:0 auto; padding:clamp(28px,4vw,48px) clamp(20px,4vw,56px) clamp(28px,4vw,48px)">
      <div style="display:flex; flex-direction:column; align-items:center; gap:clamp(18px,2.6vw,28px); width:100%; padding:clamp(28px,4.4vw,56px) 0 clamp(22px,3vw,32px); border-top:1px solid #E2E7E5; border-bottom:1px solid #E2E7E5">
        <div style="display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; column-gap:clamp(22px,5.4vw,80px); row-gap:clamp(12px,1.8vw,18px); width:100%">
          <div style="display:flex; justify-content:flex-end; min-width:0">
            <img src="assets/wordmark-green.png" alt="glomium" style="height:clamp(24px,3.6vw,44px); width:auto; max-width:100%; display:block">
          </div>
          <span aria-hidden="true" style="position:relative; display:block; width:clamp(22px,2.8vw,34px); height:clamp(22px,2.8vw,34px)">
            <span style="position:absolute; left:-21%; top:50%; width:142%; height:1.5px; margin-top:-0.75px; background:#10AF8B; transform:rotate(45deg)"></span>
            <span style="position:absolute; left:-21%; top:50%; width:142%; height:1.5px; margin-top:-0.75px; background:#10AF8B; transform:rotate(-45deg)"></span>
          </span>
          <div style="display:flex; justify-content:flex-start; min-width:0">
            <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ false }}">

                <img src="{{ logo }}" alt="{{ clientName }}" style="display:block; width:calc(clamp(24px,3.6vw,44px) * {{ logoK }}); max-width:100%; height:auto">
              </span>

            <sc-if value="{{ noLogo }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:clamp(28px,4.4vw,54px); font-weight:400; letter-spacing:-0.035em; line-height:1; color:#1B1D1E; overflow-wrap:anywhere">{{ cellName }}</span>
            </sc-if>
          </div>
          <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390; text-align:right; margin-right:-2.6px">creative partner</span>
          <span></span>
          <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">{{ clientRole }}</span>
        </div>
      </div>
    </div>

    <section id="ch-top" style="background:#1B1D1E; color:#FFFFFF">
      <div style="max-width:1232px; margin:0 auto; padding:clamp(48px,8vw,104px) clamp(20px,4vw,56px) clamp(48px,7vw,88px); display:flex; flex-direction:column; gap:clamp(40px,6vw,72px)">
        <div style="display:flex; flex-direction:column; gap:clamp(18px,2.4vw,26px)">

          </sc-if>
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap">

              <span style="display:block; width:7px; height:7px; background:#10AF8B"></span>
            </sc-if>
            <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#10AF8B">{{ kicker }}</span>
          </div>
          <h1 style="margin:0; max-width:11.5em; font-size:clamp(46px,9.4vw,132px); font-weight:200; line-height:.94; letter-spacing:-0.045em; color:#FFFFFF; text-wrap:balance">{{ heroA }}<span style="font-style:italic; color:#10AF8B">{{ heroB }}</span>{{ heroC }}</h1>
          <sc-if value="{{ hasCoverLine }}" hint-placeholder-val="{{ true }}">
            <p style="margin:0; max-width:36em; font-size:clamp(16px,1.6vw,19px); line-height:1.7; color:#C9D0CE; text-wrap:pretty">{{ coverLine }}</p>
          </sc-if>
        </div>

        <div style="display:flex; flex-direction:column; gap:12px">
          <div style="display:flex; align-items:center; gap:4px 28px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.14)">

              <div data-noprint="1" style="display:flex; gap:24px; flex-wrap:wrap">

              <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">{{ toLabel }}</span>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(min(44%,170px),1fr)); gap:clamp(28px,4vw,40px) clamp(16px,3vw,32px)">
          <sc-for list="{{ kpisVM }}" as="k" hint-placeholder-count="4">

              <span style="font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:#8A9390">{{ k.label }}</span>

              <span style="font-size:13px; line-height:1.5; color:{{ k.subColor }}">{{ k.sub }}</span>

      <section id="ch-note" style="width:100%; max-width:1232px; margin:0 auto; padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px) 0">

    // A comparison only shows when the earlier window is mostly on record —
    // history starts at the first sync, and "+1700%" against three days of
    // data is not something to put in front of a client.
    const covered = test => new Set(prev.filter(m => test(m.account_id)).map(m => m.on_date)).size >= Math.ceil(prevDays * 0.8);
    const socCov = covered(isSoc), adCov = covered(isAd);
    const change = (a, b, ok) => (ok && b > 0 ? (a - b) * 100 / b : null);
    const pctChange = c => Math.abs(c).toFixed(Math.abs(c) >= 10 ? 0 : 1) + '%';
    const deltaSub = (a, b, ok, fallback) => {
      const c = change(a, b, ok);
      if (c == null) return { sub: fallback || '', dir: 0 };
      if (Math.abs(c) < 0.5) return { sub: 'level with ' + prevWord, dir: 0 };
      return { sub: (c > 0 ? '↑ ' : '↓ ') + pctChange(c) + ' on ' + prevWord, dir: c > 0 ? 1 : -1 };
    };

    const socAccs = accounts.filter(a => SOCIAL.indexOf(a.platform) !== -1);
    const adAccs = accounts.filter(a => ADS.indexOf(a.platform) !== -1);
    const followersAt = a => {
      const r = metrics.filter(m => m.account_id === a.id && m.followers != null && m.on_date <= to)
        .sort((x, y) => (x.on_date < y.on_date ? -1 : 1));
      return r.length ? n(r[r.length - 1].followers) : null;
    };
    const fNow = socAccs.reduce((t, a) => t + (followersAt(a) || 0), 0);
    const socCur = cur.filter(m => isSoc(m.account_id)), socPrev = prev.filter(m => isSoc(m.account_id));
    const gain = sum(socCur, 'follower_delta');
    const reach = sum(socCur, 'reach'), reachPrev = sum(socPrev, 'reach');
    const growth = fNow && fNow - gain > 0 && gain ? gain * 100 / (fNow - gain) : null;

    const pN = (p, k) => n(p[k]);
    const inter = p => pN(p, 'likes') + pN(p, 'comments') + pN(p, 'shares') + pN(p, 'saves');
    const base = p => pN(p, 'reach') || pN(p, 'impressions');
    const day = p => String(p.published_at || '').slice(0, 10);
    const byDate = (x, y) => String(x.published_at || '').localeCompare(String(y.published_at || ''));
    const wPosts = posts.filter(p => day(p) >= from && day(p) <= to);
    const pPosts = posts.filter(p => day(p) >= prevFrom && day(p) <= prevTo);
    const feed = wPosts.filter(p => p.kind !== 'story');
    const stories = wPosts.filter(p => p.kind === 'story').sort(byDate).reverse();
    const erOf = list => { const m = list.filter(p => p.kind !== 'story' && base(p) > 0); const b = m.reduce((t, p) => t + base(p), 0); return b ? m.reduce((t, p) => t + inter(p), 0) * 100 / b : null; };
    const er = erOf(feed);
    const views = wPosts.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const viewsPrev = pPosts.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const postsCovered = !report ? posts.some(p => day(p) <= addDays(prevFrom, 3)) : pPosts.length > 0 || socCov;
    const rv = deltaSub(reach, reachPrev, socCov, reach ? 'across ' + plural(socAccs.length, 'profile', 'profiles') : 'nothing yet');
    const vv = deltaSub(views, viewsPrev, postsCovered && socCov, wPosts.length ? 'from ' + plural(wPosts.length, 'piece', 'pieces') + ' of content' : 'nothing published');
    const rc = change(reach, reachPrev, socCov);

    // ---- daily series ------------------------------------------------------
    const dates = []; for (let i = 0; i < days; i++) dates.push(addDays(from, i));
    const blank = () => new Map(dates.map(x => [x, 0]));
    const reachDay = blank(), gainDay = blank(), viewsDay = blank(), folDay = blank();
    for (const m of socCur) if (reachDay.has(m.on_date)) {
      reachDay.set(m.on_date, reachDay.get(m.on_date) + n(m.reach));
      gainDay.set(m.on_date, gainDay.get(m.on_date) + n(m.follower_delta));
    }
    for (const p of wPosts) { const k = day(p); if (viewsDay.has(k)) viewsDay.set(k, viewsDay.get(k) + pN(p, 'video_views')); }
    // One follower total per synced day, and a gain for every day: walk back
    // from the latest total so the line is the real curve.
    let folHas = false;
    for (const a of socAccs) {
      const ar = metrics.filter(m => m.account_id === a.id);
      const reads = ar.filter(m => m.followers != null && folDay.has(m.on_date)).sort((x, y) => (x.on_date < y.on_date ? -1 : 1));
      if (!reads.length) continue;
      folHas = true;
      const anchor = reads[reads.length - 1];
      const g = new Map(); ar.forEach(m => g.set(m.on_date, (g.get(m.on_date) || 0) + n(m.follower_delta)));
      const at = dates.indexOf(anchor.on_date);
      const v = []; v[at] = n(anchor.followers);
      for (let i = at + 1; i < dates.length; i++) v[i] = v[i - 1] + (g.get(dates[i]) || 0);
      for (let i = at - 1; i >= 0; i--) v[i] = v[i + 1] - (g.get(dates[i + 1]) || 0);
      dates.forEach((x, i) => folDay.set(x, folDay.get(x) + v[i]));
    }
    const col = mp => dates.map(x => mp.get(x));

    // ---- cover numbers -----------------------------------------------------
    const erSeq = feed.filter(p => base(p) > 0).sort(byDate).map(p => inter(p) * 100 / base(p));
    const kFol = { label: 'followers', raw: fNow || null, fmt: 'compact', dir: 0, sub: fNow ? 'across ' + plural(socAccs.length, 'profile', 'profiles') : report ? 'no count recorded in ' + periodWord : 'first reading after the next sync', ...spark(folHas ? col(folDay) : [], 40) };
    const kGain = { label: 'new followers', raw: gain, fmt: 'signed', dir: gain > 0 ? 1 : gain < 0 ? -1 : 0, sub: growth != null ? pct(growth) + ' growth in ' + periodWord : 'in ' + periodWord, ...spark(col(gainDay), 40) };
    const kReach = { label: 'reach', raw: reach, fmt: 'compact', dir: rv.dir, sub: rv.sub, ...spark(col(reachDay), 40) };
    const kViews = { label: 'views', raw: views, fmt: 'compact', dir: vv.dir, sub: vv.sub, ...spark(col(viewsDay), 40) };
    const kEr = { label: 'engagement', raw: er, fmt: 'pct', dir: 0, sub: feed.length ? 'of reach, across ' + plural(feed.length, 'post', 'posts') : 'no posts in ' + periodWord, ...spark(erSeq.length > 1 ? erSeq : [], 40) };
    const heroKpi = fNow ? kFol : kReach;
    const kpis = fNow ? [kGain, kReach, kViews, kEr] : [kFol, kGain, kViews, kEr];

    // ---- audience chart ----------------------------------------------------
    const chart = s.chart === 'followers' && !folHas ? 'reach' : s.chart;
    const isBar = chart === 'gained';
    const vals = col(chart === 'followers' ? folDay : isBar ? gainDay : reachDay);
    const N = vals.length;
    const peak = Math.max(0, ...vals), low = Math.min(0, ...vals);
    let lo = 0, hi = 1;
    if (chart === 'followers' && peak > 0) {
      const mn = Math.min(...vals), span = Math.max(peak - mn, 10), st = Math.pow(10, Math.floor(Math.log10(span)));
      lo = Math.max(0, Math.floor((mn - span * 0.25) / st) * st); hi = Math.ceil((peak + span * 0.25) / st) * st;
    } else {
      const span = Math.max(peak - low, 1), st = Math.pow(10, Math.floor(Math.log10(span)));
      hi = Math.max(st, Math.ceil(peak * 1.08 / st) * st); lo = low < 0 ? Math.floor(low / st) * st : 0;
    }
    const W = 1000, H = 260, T = 10, B = 8;
    const px = i => (isBar ? (i + 0.5) * W / N : N < 2 ? 0 : i * W / (N - 1));
    const py = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const pts = vals.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1));
    const chartHas = isBar ? vals.some(v => v !== 0) : peak > 0;
    const bw = W / Math.max(N, 1);
    const tot = vals.reduce((t, v) => t + v, 0);
    const bestI = vals.reduce((b, v, i) => (v > vals[b] ? i : b), 0);
    const first = vals[0] || 0, last = vals[N - 1] || 0;
    const unit = isBar ? ' new followers' : chart === 'reach' ? ' reached' : ' followers';

    // ---- platforms ---------------------------------------------------------
    const nameOf = a => {
      const lab = String(a.label || a.handle || PLATFORM[a.platform] || '').trim().toLowerCase();
      return a.handle && !/^https?:/i.test(a.handle) ? String(a.handle).toLowerCase() : lab;
    };
    const socRows = socAccs.map(a => {
      const ar = cur.filter(m => m.account_id === a.id), ap = wPosts.filter(p => p.account_id === a.id);
      return { a, f: followersAt(a), g: sum(ar, 'follower_delta'), r: sum(ar, 'reach'), v: ap.reduce((t, p) => t + pN(p, 'video_views'), 0) || sum(ar, 'video_views'), k: ap.length };
    });
    const shareKey = fNow ? 'f' : 'r';
    const shareTot = socRows.reduce((t, x) => t + n(x[shareKey]), 0);
    socRows.sort((x, y) => n(y[shareKey]) - n(x[shareKey]));
    const platformsVM = socRows.map((x, i) => {
      const sh = shareTot ? n(x[shareKey]) / shareTot : 0;
      const vx = x.a.platform === 'x' || x.a.platform === 'youtube';
      const bits = [];
      if (shareTot) bits.push(Math.round(sh * 100) + '% of your ' + (fNow ? 'audience' : 'reach'));
      bits.push(vx ? compact(x.v) + ' views' : compact(x.r) + ' reached');
      bits.push(x.k ? x.k + ' published' : 'nothing new');
      return {
        platform: PLATFORM[x.a.platform] || x.a.platform, name: nameOf(x.a), color: PCOL[i % PCOL.length], f: sh,
        big: x.f == null ? '—' : compact(x.f),
        gain: x.g ? signed(x.g) : '', gainColor: x.g > 0 ? '#0A6E58' : x.g < 0 ? '#B4433A' : '#6B7572',
        line: bits.join(' · '),
      };
    });
    const leadP = gain > 0 && socRows.length > 1 ? socRows.slice().sort((x, y) => y.g - x.g)[0] : null;
    const audienceBits = [];
    if (growth != null && gain > 0) audienceBits.push(pct(growth) + ' growth in ' + periodWord + (leadP && leadP.g > gain * 0.5 ? ', most of it on ' + PLATFORM[leadP.a.platform] : '') + '.');
    if (rc != null && Math.abs(rc) >= 5) audienceBits.push('reach was ' + (rc > 0 ? 'up ' : 'down ') + pctChange(rc) + ' on ' + prevWord + ', at ' + compact(reach) + ' accounts.');
    else if (reach) audienceBits.push('your content reached ' + compact(reach) + ' accounts.');

    // ---- content -----------------------------------------------------------
    const safe = u => (/^https:\/\//i.test(u || '') ? u : '');
    // Thumbs sit in an unquoted CSS url(); escape the few characters that end one.
    const cssUrl = u => String(u || '').replace(/[()\s'"\\]/g, c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'));
    const newest = (report ? feed : posts.filter(p => p.kind !== 'story')).slice().sort(byDate).reverse().slice(0, 12);
    const latestVM = newest.map(p => {
      const t = cssUrl(safe(p.thumb_url)), l = safe(p.permalink);
      return {
        thumb: t, hasThumb: !!t, href: l, hasLink: !!l, kind: KIND[p.kind] || p.kind,
        when: fmtDay(p.published_at), platform: PLATFORM[plat(p.account_id)] || '',
        views: compact(pN(p, 'video_views') || base(p)), viewsLabel: pN(p, 'video_views') ? 'views' : 'reach',
        likes: compact(pN(p, 'likes')),
      };
    });
    const ranked = feed.slice().sort((x, y) => (pN(y, 'video_views') - pN(x, 'video_views')) || (base(y) - base(x)));
    const topVM = ranked.slice(0, 7).map((p, i) => {
      const e = base(p) ? inter(p) * 100 / base(p) : null;
      const thumb = cssUrl(safe(p.thumb_url)), link = safe(p.permalink);
      const cap = String(p.caption || '').replace(/\s+/g, ' ').trim();
      const vw = pN(p, 'video_views');
      return {
        rank: String(i + 1).padStart(2, '0'), kind: KIND[p.kind] || p.kind, platform: PLATFORM[plat(p.account_id)] || '',
        when: fmtDay(p.published_at), captionLong: cap ? cap.slice(0, 220).toLowerCase() + (cap.length > 220 ? '…' : '') : 'no caption', captionColor: cap ? '#1B1D1E' : '#8A9390',
        thumb, hasThumb: !!thumb, link, hasLink: !!link,
        headline: compact(vw || base(p)), headlineLabel: vw ? 'views' : 'reach', er: e == null ? '' : pct(e),
        statsVM: [
          { label: vw ? 'views' : 'likes', value: compact(vw || pN(p, 'likes')) },
          { label: pN(p, 'reach') ? 'reached' : 'impressions', value: compact(base(p)) },
          { label: 'engagement', value: pct(e) },
        ],
        smallVM: [['likes', 'likes'], ['comments', 'comments'], ['shares', 'shares'], ['saves', 'saves']]
          .filter(([k]) => pN(p, k) > 0).map(([k, l]) => ({ label: l, value: compact(pN(p, k)) })),
      };
    });

    const mix = {};
    feed.forEach(p => { const k = p.kind || 'post'; const m = mix[k] || (mix[k] = { n: 0, b: 0 }); m.n++; m.b += base(p); });
    const mixRows = Object.keys(mix).map(k => ({ k, n: mix[k].n, avg: mix[k].b / mix[k].n })).filter(x => x.avg > 0).sort((x, y) => y.avg - x.avg);
    const mixMax = mixRows.length ? mixRows[0].avg : 1;
    const kp = k => KINDS[k] || k + 's';
    let mixLine = '', mixLeads = false;
    if (mixRows.length >= 2) {
      const a = mixRows[0], b = mixRows[1], ratio = a.avg / b.avg;
      mixLeads = ratio >= 1.15;
      mixLine = ratio >= 1.95 ? kp(a.k) + ' reached ' + ratio.toFixed(1) + '× as many people as ' + kp(b.k) + '.'
        : ratio >= 1.1 ? kp(a.k) + ' reached ' + Math.round((ratio - 1) * 100) + '% more people than ' + kp(b.k) + '.'
        : kp(a.k) + ' and ' + kp(b.k) + ' reached about the same number of people.';
    }
    const mixVM = mixRows.map((x, i) => ({ label: kp(x.k), count: plural(x.n, 'piece', 'pieces'), value: compact(x.avg), f: x.avg / mixMax, color: i === 0 ? '#10AF8B' : '#C9D0CE' }));

    const wd = Array.from({ length: 7 }, () => ({ n: 0, b: 0 }));
    feed.forEach(p => { const t = new Date(p.published_at); if (isNaN(t)) return; const w = wd[t.getDay()]; w.n++; w.b += base(p); });
    const order = [1, 2, 3, 4, 5, 6, 0];
    const avgs = order.map(i => (wd[i].n ? wd[i].b / wd[i].n : 0));
    const wMax = Math.max(0, ...avgs);
    const solid = order.map((i, j) => (wd[i].n >= 2 ? j : -1)).filter(j => j >= 0);
    const pool = solid.length ? solid : order.map((_, j) => j);
    const bestJ = pool.reduce((b, j) => (avgs[j] > avgs[b] ? j : b), pool[0]);
    const hasDays = feed.length >= 6 && wd.filter(x => x.n).length >= 3 && wMax > 0;
    const daysVM = order.map((i, j) => ({
      label: WEEK[i].slice(0, 3), value: wd[i].n ? compact(avgs[j]) : '—', f: wMax ? avgs[j] / wMax : 0,
      color: j === bestJ ? '#10AF8B' : '#C9D0CE', valueColor: j === bestJ ? '#0A6E58' : '#6B7572', labelColor: j === bestJ ? '#1B1D1E' : '#8A9390',
    }));
    const dayLine = hasDays ? WEEK[order[bestJ]] + ' posts reached the most people — ' + compact(avgs[bestJ]) + ' on average.' : '';

    const counts = {}; feed.forEach(p => { counts[p.kind] = (counts[p.kind] || 0) + 1; });
    const parts = Object.keys(counts).sort((x, y) => counts[y] - counts[x]).map(k => counts[k] + ' ' + (counts[k] === 1 ? KIND[k] || k : kp(k)));
    const contentTitle = mixLeads ? kp(mixRows[0].k) + ' did the heavy lifting.' : feed.length ? plural(feed.length, 'piece', 'pieces') + ' went live.' : 'your latest content.';
    const contentLine = feed.length ? (mixLeads ? plural(feed.length, 'piece', 'pieces') + ' went live in ' + periodWord : 'in ' + periodWord) + ': ' + parts.join(', ') + (stories.length ? ', plus ' + plural(stories.length, 'story', 'stories') : '') + '.' : '';

    // ---- stories -----------------------------------------------------------
    const sViews = stories.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const sReach = stories.reduce((t, p) => t + pN(p, 'reach'), 0);
    const sExits = stories.reduce((t, p) => t + pN(p, 'exits'), 0);
    const sReplies = stories.reduce((t, p) => t + pN(p, 'replies'), 0);
    const stayed = sViews ? Math.max(0, 100 - sExits * 100 / sViews) : null;
    const storyStatsVM = [
      { label: 'stories', value: String(stories.length), sub: 'posted in ' + periodWord },
      { label: 'avg views', value: stories.length ? compact(Math.round(sViews / stories.length)) : '—', sub: 'per story' },
      { label: 'avg reach', value: stories.length ? compact(Math.round(sReach / stories.length)) : '—', sub: 'people per story' },
      { label: 'replies', value: compact(sReplies), sub: 'messages from stories' },
    ];
    const storyTilesVM = stories.slice(0, 16).map(p => {
      const t = cssUrl(safe(p.thumb_url)), v = pN(p, 'video_views');
      return { thumb: t, hasThumb: !!t, views: compact(v), when: fmtDay(p.published_at), keep: v ? Math.max(0, 100 - pN(p, 'exits') * 100 / v).toFixed(1) + '%' : '0%' };
    });

    // ---- ads ---------------------------------------------------------------
    const adCur = cur.filter(m => isAd(m.account_id)), adPrev = prev.filter(m => isAd(m.account_id));
    const aImp = sum(adCur, 'impressions'), aClk = sum(adCur, 'clicks'), aConv = sum(adCur, 'conversions'), aSpend = sum(adCur, 'spend'), aReach = sum(adCur, 'reach');
    const cv = deltaSub(aClk, sum(adPrev, 'clicks'), adCov, aImp ? pct(aClk * 100 / aImp) + ' click-through' : '');
    const fun = [];
    if (aReach) fun.push({ label: 'people reached', v: aReach, rate: 'saw an ad at least once' });
    if (aImp) fun.push({ label: 'impressions', v: aImp, rate: aReach ? (aImp / aReach).toFixed(1) + ' per person' : 'times an ad was shown' });
    if (aClk) fun.push({ label: 'clicks', v: aClk, rate: aImp ? pct(aClk * 100 / aImp) + ' click-through' : '' });
    if (aConv) fun.push({ label: 'results', v: aConv, rate: aClk ? pct(aConv * 100 / aClk) + ' of clicks' : 'purchases and leads' });
    const fMax = Math.max(1, ...fun.map(x => x.v));
    const funnelVM = fun.map(x => ({ label: x.label, raw: x.v, fmt: 'compact', rate: x.rate, f: Math.max(x.v / fMax, 0.012) }));
    const costVM = [
      { label: 'spent', raw: aSpend, fmt: 'inr', sub: 'paid to the platforms in ' + periodWord },
      aConv ? { label: 'per result', raw: aSpend / aConv, fmt: 'inr', sub: 'each purchase or lead' } : null,
      aClk ? { label: 'per click', raw: aSpend / aClk, fmt: 'inr', sub: cv.sub } : null,
    ].filter(Boolean);
    const adAccVM = adAccs.map(a => {
      const ar = cur.filter(m => m.account_id === a.id);
      const sp = sum(ar, 'spend'), cl = sum(ar, 'clicks'), co = sum(ar, 'conversions');
      return { platform: PLATFORM[a.platform] || a.platform, name: nameOf(a), line: [inr(sp) + ' spent', compact(cl) + ' clicks', co ? compact(co) + ' results' : ''].filter(Boolean).join(' · ') };
    });
    const hasAds = adAccs.length > 0 && (aImp > 0 || aSpend > 0);
    const adsTitle = aConv && aSpend ? inr(aSpend) + ' in ads brought ' + compact(aConv) + ' results.' : 'ads were seen ' + compact(aImp) + ' times.';

    // ---- notes and plan ----------------------------------------------------
    const latest = report ? { month: report.month, notes: report.notes, plan: report.plan } : (d.latest || null);
    const lm = latest && latest.month ? monthOnly(latest.month) : '';
    const nextOf = m => { const x = new Date(String(m).slice(0, 10) + 'T12:00:00'); x.setMonth(x.getMonth() + 1); return MONTHS[x.getMonth()]; };
    const lines = t => String(t || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
    const noteLines = lines(latest && latest.notes), planLines = lines(latest && latest.plan);

    // ---- reports archive ---------------------------------------------------
    const reports = (d.reports || []).slice().sort((x, y) => String(x.month).localeCompare(String(y.month)));
    const openKey = report ? String(report.month).slice(0, 7) : '';
    const issueNo = r => String(reports.indexOf(r) + 1).padStart(2, '0');
    const reportsVM = reports.slice().reverse().map(r => {
      const on = openKey && String(r.month).slice(0, 7) === openKey;
      return {
        no: issueNo(r), month: monthOnly(r.month), year: String(r.month).slice(0, 4), sub: 'published ' + fmtDay(r.published_at),
        cta: on ? 'reading' : 'read →', go: () => this.openMonth(String(r.month).slice(0, 10)),
        bg: on ? '#1B1D1E' : '#FFFFFF', ink: on ? '#FFFFFF' : '#1B1D1E', border: on ? '#1B1D1E' : '#E2E7E5',
        labelColor: '#8A9390', ctaColor: on ? '#10AF8B' : '#0A6E58',
      };
    });
    const openR = report ? reports.find(r => String(r.month).slice(0, 7) === openKey) : null;

    // ---- cover -------------------------------------------------------------
    const heroFor = () => {
      if (report) return [monthOnly(from) + ', ', 'in review', '.'];
      if (rc != null && rc >= 5) return ['reach is up ', pctChange(rc), '.'];
      if (growth != null && growth >= 0.5) return ['your audience grew ', pct(growth), '.'];
      return ['your digital, ', 'in numbers', '.'];
    };
    const [heroA, heroB, heroC] = heroFor();
    const bits = [];
    if (reach) bits.push(compact(reach) + ' accounts reached');
    if (feed.length) bits.push(plural(feed.length, 'piece', 'pieces') + ' published');
    if (stories.length) bits.push(plural(stories.length, 'story', 'stories'));
    if (aConv) bits.push(compact(aConv) + ' ad results');
    const coverLine = bits.length ? (report ? monthOnly(from) : periodWord) + ', at a glance: ' + (bits.length > 1 ? bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1] : bits[0]) + '.' : '';

    // ---- chapters ----------------------------------------------------------
    const hasContent = latestVM.length > 0 || topVM.length > 0;
    const chs = [['audience', 'audience', true], ['content', 'content', hasContent], ['stories', 'stories', stories.length > 0], ['ads', 'ads', hasAds], ['next', 'the plan', planLines.length > 0], ['reports', 'reports', reports.length > 0]]
      .filter(c => c[2]).map((c, i) => ({ id: c[0], label: c[1], num: String(i + 1).padStart(2, '0') }));
    const ch = {}; chs.forEach(c => { ch[c.id] = c.num; });

    return {
      isReport: !!report, isLive: !report,
      kicker: report ? 'monthly report' + (openR ? ' · no. ' + issueNo(openR) : '') + ' · published ' + fmtDay(report.published_at) : 'live' + (d.updated_at ? ' · updated ' + this.ago(d.updated_at) : ''),
      heroA, heroB, heroC, coverLine, hasCoverLine: !!coverLine,
      windowLabel: report ? fmtDay(from) + ' – ' + fmtDay(to) + ' ' + String(to).slice(0, 4) : fmtDay(from) + ' – ' + fmtDay(to),
      fromLabel: fmtDay(from), toLabel: fmtDay(to),
      empty: !cur.length && !wPosts.length,
      heroKpi, kpis,
      chartKind: chart, chartIsBar: isBar, chartN: N,
      audienceTitle: gain > 0 ? 'you gained ' + full(gain) + ' followers.' : fNow ? full(fNow) + ' people follow you.' : 'your audience, day by day.',
      audienceLine: audienceBits.join(' '), hasAudienceLine: audienceBits.length > 0,
      chartTabsVM: [['followers', 'followers', folHas], ['gained', 'new followers', true], ['reach', 'reach', true]].filter(c => c[2])
        .map(([k, l]) => ({ label: l, go: () => { this.setState({ chart: k, hover: null }); this.play(['tc']); }, color: chart === k ? '#1B1D1E' : '#8A9390', bar: chart === k ? '#10AF8B' : 'transparent' })),
      chartHas, chartEmpty: !chartHas,
      chartPath: !isBar && pts.length ? 'M' + pts.join(' L') : NOPATH,
      chartArea: !isBar && pts.length ? 'M0,' + (H - B) + ' L' + pts.join(' L') + ' L' + px(N - 1).toFixed(1) + ',' + (H - B) + ' Z' : NOPATH,
      chartBarsVM: isBar ? vals.map((v, i) => { const y0 = py(0), y1 = py(v); return { x: (i * bw + bw * 0.18).toFixed(1), w: (bw * 0.64).toFixed(1), y: Math.min(y0, y1).toFixed(1), h: (v ? Math.max(Math.abs(y1 - y0), 2) : 0).toFixed(1), fill: v < 0 ? '#B4433A' : '#10AF8B' }; }) : [],
      chartPts: vals.map((v, i) => ({ x: px(i) / W * 100, y: py(v) / H * 100, date: fmtDay(dates[i]), value: (isBar ? (v > 0 ? '+' : v < 0 ? '−' : '') + full(Math.abs(v)) : full(v)) + unit })),
      chartGridVM: [1, 0.75, 0.5, 0.25, 0].map(f => ({ y: py(lo + (hi - lo) * f), label: compact(lo + (hi - lo) * f) })),
      chartAxisVM: [0, Math.floor((N - 1) / 2), N - 1].filter((v, i, a) => a.indexOf(v) === i)
        .map(i => ({ label: fmtDay(dates[i]), align: i === 0 ? 'flex-start' : i === N - 1 ? 'flex-end' : 'center' })),
      chartSummaryVM: chart === 'followers'
        ? [{ label: 'now', value: compact(last) }, { label: 'change', value: signed(last - first) }, { label: 'at the start', value: compact(first) }]
        : [{ label: isBar ? 'gained' : 'total reach', value: isBar ? signed(tot) : compact(tot) }, { label: 'a day', value: isBar ? signed(Math.round(tot / days)) : compact(Math.round(tot / days)) }, { label: 'best day', value: vals[bestI] > 0 ? compact(vals[bestI]) + ' · ' + fmtDay(dates[bestI]) : '—' }],
      platformsVM, hasPlatforms: platformsVM.length > 1 || (platformsVM.length === 1 && shareTot > 0),
      shareLabel: fNow ? 'where your audience is' : 'where your reach came from',
      hasContent, contentTitle, contentLine, hasContentLine: !!contentLine,
      feature: topVM[0] || {}, hasFeature: topVM.length > 0,
      restVM: topVM.slice(1), hasRest: topVM.length > 1, topCount: String(topVM.length),
      mixVM, hasMix: mixRows.length >= 2, mixLine,
      daysVM, hasDays, dayLine, hasWorks: mixRows.length >= 2 || hasDays,
      latestVM, hasLatest: latestVM.length > 0, latestHint: latestVM.length > 2 ? 'swipe →' : '',
      latestLabel: report ? 'everything from ' + monthOnly(from) : 'latest posts',
      hasStories: stories.length > 0, storyStatsVM, storyTilesVM,
      storiesTitle: stayed != null && sExits > 0 ? 'stories held ' + Math.round(stayed) + '% of viewers.' : plural(stories.length, 'story', 'stories') + ' in ' + periodWord + '.',
      hasKeep: stayed != null && sExits > 0, keepF: (stayed || 0) / 100,
      keepLabel: stayed != null ? pct(stayed) + ' kept watching' : '', leaveLabel: stayed != null ? pct(100 - stayed) + ' tapped away' : '',
      hasAds, adsTitle, funnelVM, costVM, adAccVM, hasAdAccs: adAccVM.length > 1,
      notesLabel: report ? 'a note on ' + lm : 'a note from us · ' + lm,
      noteLead: noteLines[0] || '', noteRestVM: noteLines.slice(1).map(text => ({ text })), hasNotes: noteLines.length > 0,
      planTitle: latest && latest.month ? 'the plan for ' + nextOf(latest.month) + '.' : 'the plan.',
      planVM: planLines.map((text, i) => ({ num: String(i + 1).padStart(2, '0'), text })), hasPlan: planLines.length > 0,
      reportsVM, hasReports: reports.length > 0,
      chs, ch,
    };
  }

  ago(t) {
    const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
    return m < 2 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : fmtDay(t);
  }

  renderVals() {
    const s = this.state, d = s.data;
    const b = s.brand || (d && (d.brand || { client: d.client, logo: d.logo })) || {};
    const client = String(b.client || '');
    // Shown once read: the trimmed copy when the host allows it, else the file as uploaded.
    const logo = b.logo && /^https:\/\//i.test(b.logo) && !s.logoFailed && s.logoRatio && (!s.logoWait || s.logoSrc)
      ? String(s.logoSrc || b.logo) : '';
    const sinceD = b.since ? new Date(String(b.since).slice(0, 10) + 'T12:00:00') : null;
    const since = sinceD && !isNaN(sinceD) ? MON[sinceD.getMonth()] + ' ' + sinceD.getFullYear() : '';
    const lr = Math.min(Math.max(s.logoRatio || 3, 0.25), 12);
    const reasons = {
      invalid: ['this link is not valid', 'it may have been mistyped, or replaced with a newer one. ask your glomium contact for the current link.'],
      locked: ['too many tries', 'the page is locked for 15 minutes after five wrong pins. try again after that, or ask us to reset it.'],
      nopin: ['almost ready', 'we are still setting this page up. your glomium contact will send the pin when it is ready.'],
      offline: ['could not connect', 'check your connection and reload the page.'],
      missing: ['report not found', 'that month has not been published yet.'],
    };
    const dead = !s.loading && !!reasons[s.reason];
    const page = !s.loading && !s.reason && d && (d.mode === 'live' || d.mode === 'report');
    const vm = page ? this.vmFor(d) : {};
    this._navIds = page ? vm.chs.map(c => c.id) : [];

    // Animated layer over the built numbers.
    const e = ease(s.t), ec = ease(s.tc);
    const clip = ((1 - e) * 100).toFixed(2);
    const onInk = k => ({ ...k, value: k.raw == null ? '—' : FMT[k.fmt](k.raw * e), subColor: k.dir > 0 ? '#10AF8B' : '#C9D0CE', clip });
    const bar = x => ({ ...x, w: (x.f * e * 100).toFixed(2) + '%' });
    const hp = page && s.hover != null && vm.chartPts ? vm.chartPts[s.hover] : null;

    return {
      loading: s.loading,
      clientName: client, clientLower: client.toLowerCase(),
      logo, hasLogo: !!logo, noLogo: !logo && !!client,
      logoK: (Math.min(2.2, Math.max(0.9, Math.sqrt(3.489 / lr))) * lr).toFixed(3),
      // A white mark sits on a small ink plate instead of vanishing.
      plateBg: logo && s.logoOnInk ? '#1B1D1E' : 'transparent',
      platePad: logo && s.logoOnInk ? '14px 20px' : '0',
      clientRole: since ? 'since ' + since : 'client',
      cellName: client.toLowerCase(),
      dead, deadTitle: dead ? reasons[s.reason][0] : '', deadNote: dead ? reasons[s.reason][1] : '',
      showGate: !s.loading && s.reason === 'gate',
      pin: s.pin,
      onPin: ev => {
        const v = String(ev.target.value || '').replace(/\D/g, '').slice(0, 4);
        this.setState({ pin: v, gateStatus: '' });
        if (v.length === 4 && !s.checking) this.fetch(v);
      },
      onPinKey: ev => { if (ev.key === 'Enter' && s.pin.length === 4) this.fetch(s.pin); },
      openPin: () => (s.pin.length === 4 ? this.fetch(s.pin) : this.setState({ gateStatus: 'the pin is four digits.' })),
      checking: s.checking, openLabel: s.checking ? 'opening…' : 'open',
      gateStatus: s.gateStatus, hasGateStatus: !!s.gateStatus,
      showPage: !!page, notPage: !page,
      ...vm,
      ch: vm.ch || {},
      heroKpi: page ? onInk(vm.heroKpi) : {},
      kpisVM: page ? vm.kpis.map(onInk) : [],
      platformsVM: page ? vm.platformsVM.map(bar) : [],
      mixVM: page ? vm.mixVM.map(bar) : [],
      daysVM: page ? vm.daysVM.map(x => ({ ...x, h: Math.max(3, Math.round(x.f * e * 112)) + 'px' })) : [],
      funnelVM: page ? vm.funnelVM.map(x => ({ ...bar(x), value: FMT[x.fmt](x.raw * e) })) : [],
      costVM: page ? vm.costVM.map(x => ({ ...x, value: FMT[x.fmt](x.raw * e) })) : [],
      keepW: page ? (vm.keepF * e * 100).toFixed(2) + '%' : '0%',
      chartClip: ((1 - ec) * 100).toFixed(2),
      hasHover: !!hp,
      hoverX: hp ? hp.x.toFixed(2) : '0', hoverY: hp ? hp.y.toFixed(2) : '0',
      hoverShift: hp ? (hp.x < 16 ? '-12px' : hp.x > 84 ? 'calc(-100% + 12px)' : '-50%') : '-50%',
      hoverDate: hp ? hp.date : '', hoverValue: hp ? hp.value : '',
      onChartMove: ev => {
        const r = ev.currentTarget.getBoundingClientRect();
        const N = vm.chartN || 0;
        if (!r.width || !N) return;
        const f = (ev.clientX - r.left) / r.width;
        const i = Math.max(0, Math.min(N - 1, vm.chartIsBar ? Math.floor(f * N) : Math.round(f * (N - 1))));
        if (i !== this.state.hover) this.setState({ hover: i });
      },
      onChartLeave: ev => { if (ev.pointerType === 'mouse') this.setState({ hover: null }); },
      navVM: page ? vm.chs.map(c => ({
        id: c.id, label: c.label, go: () => this.goTo(c.id),
        color: s.active === c.id ? '#1B1D1E' : '#8A9390', bar: s.active === c.id ? '#10AF8B' : 'transparent',
      })) : [],
      rangesVM: RANGES.map(([k, l]) => ({
        label: l, go: () => { if (s.range !== k) { this.setState({ range: k, hover: null }); this.play(['t', 'tc']); } },
        color: s.range === k ? '#FFFFFF' : '#8A9390', bar: s.range === k ? '#10AF8B' : 'transparent',
      })),
      goTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      goLive: () => this.openMonth(null),
      print: () => { this.setState({ t: 1, tc: 1 }); setTimeout(() => window.print(), 80); },
      refresh: () => this.refresh(),
      refreshing: !!s.refreshing,
      refreshLabel: s.refreshing ? 'refreshing…' : '↻ refresh',
      refreshColor: s.refreshing ? '#8A9390' : '#10AF8B',
      refreshTitle: 'pull the latest numbers from every platform',
      refreshNote: s.refreshNote || '', hasRefreshNote: !!s.refreshNote && !!page && !(vm && vm.isReport),
    };
  }
}

// Sample bundle for ?demo=1, so the page can be reviewed without a live link.
function demoData(month) {
  const to = iso(new Date()), A = 'ig', F = 'fb', M = 'ads';
  const metrics = [], posts = [];
  // A count every day, walked back from today through each day's gain — the
  // way the sync records it, so past months have readings too.
  let igF = 22184, fbF = 8410;
  for (let i = 0; i < 120; i++) {
    const d = addDays(to, -i), w = 1 + 0.25 * Math.sin(i / 5);
    const ig = Math.round(9 - i * 0.04 + (i % 7 === 2 ? 14 : 0)), fb = 2;
    metrics.push({ account_id: A, on_date: d, reach: Math.round((3400 - i * 9) * w), follower_delta: ig, followers: igF });
    metrics.push({ account_id: F, on_date: d, reach: Math.round(900 * w), follower_delta: fb, followers: fbF });
    igF -= ig; fbF -= fb;
    metrics.push({ account_id: M, on_date: d, reach: Math.round(4200 * w), impressions: Math.round(9800 * w), clicks: Math.round(150 * w), conversions: i % 3 === 0 ? 3 : 1, spend: Math.round(700 * w) });
  }
  const kinds = ['reel', 'post', 'carousel', 'reel', 'reel', 'post'];
  for (let i = 0; i < 26; i++) {
    const at = new Date(Date.now() - (i * 2.6 + 0.5) * 86400000).toISOString();
    const k = kinds[i % kinds.length];
    posts.push({ account_id: i % 5 === 4 ? F : A, kind: k, caption: ['the new flagship, in hand', 'exchange day at the store — bring your old phone', 'three colours, one choice', 'unboxing, slowly', 'weekend offer ends sunday', 'behind the counter'][i % 6], published_at: at, reach: (k === 'reel' ? 6800 : 3600) + ((i * 937) % 4100), likes: 180 + ((i * 53) % 400), comments: 6 + (i % 9), shares: 4 + (i % 13), saves: 9 + (i % 17), video_views: k === 'reel' ? 9000 + ((i * 1777) % 21000) : 0 });
  }
  for (let i = 0; i < 9; i++) posts.push({ account_id: A, kind: 'story', published_at: new Date(Date.now() - (i * 3 + 0.2) * 86400000).toISOString(), reach: 760 + i * 31, video_views: 880 + i * 40, exits: 30 + i * 9, replies: i % 3 });
  const accounts = [{ id: A, platform: 'instagram', label: 'mr.fone', handle: '@mrfone' }, { id: F, platform: 'facebook', label: 'mr.fone', handle: 'mr.fone kerala' }, { id: M, platform: 'meta_ads', label: 'store campaigns' }];
  const d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth() - 1);
  const m0 = iso(d0), m1 = (() => { const x = new Date(d0); x.setMonth(x.getMonth() - 1); return iso(x); })();
  const reports = [{ month: m0, published_at: addDays(to, -6) }, { month: m1, published_at: addDays(to, -36) }];
  const notes = 'reels carried the month — the exchange-day series did twice the views of the product shots.\nstories were steadier than last month, with fewer people skipping past the second frame.';
  const plan = 'more short reels from the store floor, two a week.\na festive offer campaign from the 20th, with a tighter audience around the three stores.';
  const base = { ok: true, client: 'Mr.Fone', logo: '', reports, brand: { client: 'Mr.Fone', logo: '', since: '2025-09-01' } };
  if (month) {
    const f = String(month).slice(0, 7) + '-01', e = (() => { const x = new Date(f + 'T12:00:00'); x.setMonth(x.getMonth() + 1); x.setDate(0); return iso(x); })();
    const pf = (() => { const x = new Date(f + 'T12:00:00'); x.setMonth(x.getMonth() - 1); return iso(x); })();
    return { ...base, mode: 'report', report: { month: f, published_at: addDays(e, 3), notes, plan, snapshot: { from: f, to: e, prev_from: pf, accounts, metrics, posts } } };
  }
  return { ...base, mode: 'live', accounts, metrics, posts, updated_at: new Date(Date.now() - 14 * 60000).toISOString(), latest: { month: m0, notes, plan } };
}
