    const accounts = src.accounts || [];
    const metrics = src.metrics || [];
    const posts = src.posts || [];
    const accById = new Map(accounts.map(a => [a.id, a]));
    const plat = id => (accById.get(id) || {}).platform;
    const isSoc = id => SOCIAL.indexOf(plat(id)) !== -1;
    const isAd = id => ADS.indexOf(plat(id)) !== -1;

    let from, to, prevFrom;
    if (report) { from = String(src.from).slice(0, 10); to = String(src.to).slice(0, 10); prevFrom = String(src.prev_from).slice(0, 10); }
    else { to = iso(new Date()); from = addDays(to, -(s.range - 1)); prevFrom = addDays(from, -s.range); }
    const prevTo = addDays(from, -1);
    const days = dayCount(from, to), prevDays = dayCount(prevFrom, prevTo);
    const periodWord = report ? monthName(from).split(' ')[0] : 'the last ' + days + ' days';
    const prevWord = report ? monthName(prevFrom).split(' ')[0] : 'the ' + days + ' days before';

    const inW = m => m.on_date >= from && m.on_date <= to;
    const inP = m => m.on_date >= prevFrom && m.on_date <= prevTo;
    const cur = metrics.filter(inW), prev = metrics.filter(inP);
    const sum = (list, k) => list.reduce((t, r) => t + n(r[k]), 0);
    // A comparison only shows when the earlier window is mostly on record —
    // history starts at the first sync, and "+1700%" against three days of
    // data is not something to put in front of a client.
    const covered = test => new Set(prev.filter(m => test(m.account_id)).map(m => m.on_date)).size >= Math.ceil(prevDays * 0.8);
    const socCov = covered(isSoc), adCov = covered(isAd);
    const change = (a, b, ok) => (ok && b > 0 ? (a - b) * 100 / b : null);
    const pctChange = c => Math.abs(c).toFixed(Math.abs(c) >= 10 ? 0 : 1) + '%';
    const deltaSub = (a, b, ok, fallback) => {
      const c = change(a, b, ok);
      if (c == null) return { sub: fallback || '', color: '#4A524F' };
      if (Math.abs(c) < 0.5) return { sub: 'level with ' + prevWord, color: '#4A524F' };
      return { sub: (c > 0 ? '↑ ' : '↓ ') + pctChange(c) + ' on ' + prevWord, color: c > 0 ? '#0A6E58' : '#B4433A' };
    };

    const socAccs = accounts.filter(a => SOCIAL.indexOf(a.platform) !== -1);
    const adAccs = accounts.filter(a => ADS.indexOf(a.platform) !== -1);
    const followersAt = a => {
      const r = metrics.filter(m => m.account_id === a.id && m.followers != null && m.on_date <= to)
        .sort((x, y) => (x.on_date < y.on_date ? -1 : 1));
      return r.length ? n(r[r.length - 1].followers) : null;
    };
    const fNow = socAccs.reduce((t, a) => t + (followersAt(a) || 0), 0);
    const socCur = cur.filter(m => isSoc(m.account_id)), socPrev = prev.filter(m => isSoc(m.account_id));
    const gain = sum(socCur, 'follower_delta');
    const reach = sum(socCur, 'reach'), reachPrev = sum(socPrev, 'reach');

    const pN = (p, k) => n(p[k]);
    const inter = p => pN(p, 'likes') + pN(p, 'comments') + pN(p, 'shares') + pN(p, 'saves');
    const base = p => pN(p, 'reach') || pN(p, 'impressions');
    const day = p => String(p.published_at || '').slice(0, 10);
    const wPosts = posts.filter(p => day(p) >= from && day(p) <= to);
    const pPosts = posts.filter(p => day(p) >= prevFrom && day(p) <= prevTo);
    const feed = wPosts.filter(p => p.kind !== 'story');
    const stories = wPosts.filter(p => p.kind === 'story');
    const erOf = list => { const m = list.filter(p => p.kind !== 'story' && base(p) > 0); const b = m.reduce((t, p) => t + base(p), 0); return b ? m.reduce((t, p) => t + inter(p), 0) * 100 / b : null; };
    const er = erOf(feed);
    const views = wPosts.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const viewsPrev = pPosts.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const postsCovered = !report ? posts.some(p => day(p) <= addDays(prevFrom, 3)) : pPosts.length > 0 || socCov;

    const rv = deltaSub(reach, reachPrev, socCov, reach ? 'across ' + plural(socAccs.length, 'profile', 'profiles') : 'nothing yet');
    const vv = deltaSub(views, viewsPrev, postsCovered && socCov, wPosts.length ? 'from ' + plural(wPosts.length, 'piece', 'pieces') + ' of content' : 'nothing published');
    const headlineVM = [
      { label: 'followers', value: fNow ? compact(fNow) : '—', sub: fNow ? 'across ' + plural(socAccs.length, 'profile', 'profiles') : report ? 'no count recorded in ' + periodWord : 'first reading after the next sync', subColor: '#4A524F' },
      { label: 'new followers', value: gain ? signed(gain) : '0', sub: fNow && fNow - gain > 0 && gain ? pct(gain * 100 / (fNow - gain)) + ' growth in ' + periodWord : 'in ' + periodWord, subColor: gain > 0 ? '#0A6E58' : gain < 0 ? '#B4433A' : '#4A524F' },
      { label: 'reach', value: compact(reach), sub: rv.sub, subColor: rv.color },
      { label: 'views', value: compact(views), sub: vv.sub, subColor: vv.color },
      { label: 'engagement', value: pct(er), sub: feed.length ? 'likes, comments, shares and saves, of reach' : 'no posts in ' + periodWord, subColor: '#4A524F' },
    ];

    // ---- chart -----------------------------------------------------------
    const dates = []; for (let i = 0; i < days; i++) dates.push(addDays(from, i));
    const series = new Map(dates.map(x => [x, 0]));
    const chart = s.chart === 'reach' ? 'reach' : 'followers';
    if (chart === 'followers') {
      // One follower total per synced day, and a gain for every day: walk
      // back from the latest total so the line is the real curve.
      for (const a of socAccs) {
        const ar = metrics.filter(m => m.account_id === a.id);
        const reads = ar.filter(m => m.followers != null && series.has(m.on_date)).sort((x, y) => (x.on_date < y.on_date ? -1 : 1));
        if (!reads.length) continue;
        const anchor = reads[reads.length - 1];
        const g = new Map(); ar.forEach(m => g.set(m.on_date, (g.get(m.on_date) || 0) + n(m.follower_delta)));
        const at = dates.indexOf(anchor.on_date);
        const v = []; v[at] = n(anchor.followers);
        for (let i = at + 1; i < dates.length; i++) v[i] = v[i - 1] + (g.get(dates[i]) || 0);
        for (let i = at - 1; i >= 0; i--) v[i] = v[i + 1] - (g.get(dates[i + 1]) || 0);
        dates.forEach((x, i) => series.set(x, series.get(x) + v[i]));
      }
    } else {
      for (const m of socCur) if (series.has(m.on_date)) series.set(m.on_date, series.get(m.on_date) + n(m.reach));
    }
    const vals = dates.map(x => series.get(x));
    const peak = Math.max(0, ...vals);
    let lo = 0, hi;
    if (chart === 'followers' && peak > 0) {
      const mn = Math.min(...vals), span = Math.max(peak - mn, 10), st = Math.pow(10, Math.floor(Math.log10(span)));
      lo = Math.max(0, Math.floor((mn - span * 0.25) / st) * st); hi = Math.ceil((peak + span * 0.25) / st) * st;
    } else { const st = peak <= 0 ? 1 : Math.pow(10, Math.floor(Math.log10(peak))); hi = peak <= 0 ? 1 : Math.ceil(peak / st) * st; }
    const W = 1000, H = 260, T = 10, B = 8;
    const px = i => (dates.length < 2 ? 0 : i * W / (dates.length - 1));
    const py = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const pts = vals.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1));
    const first = vals[0] || 0, last = vals[vals.length - 1] || 0;
    const best = dates.reduce((m, x) => (series.get(x) > m.v ? { v: series.get(x), d: x } : m), { v: 0, d: '' });

    // ---- platforms ---------------------------------------------------------
    const platformsVM = accounts.map(a => {
      const ar = cur.filter(m => m.account_id === a.id);
      const ap = wPosts.filter(p => p.account_id === a.id);
      const st = (label, value, sub, color) => ({ label, value, sub: sub || '', subColor: color || '#6B7572' });
      const name = String(a.label || a.handle || PLATFORM[a.platform] || '').trim().toLowerCase();
      if (ADS.indexOf(a.platform) !== -1) {
        const c = sum(ar, 'clicks'), i = sum(ar, 'impressions');
        return { platform: PLATFORM[a.platform], name, statsVM: [
          st(a.platform === 'meta_ads' ? 'reach' : 'impressions', compact(a.platform === 'meta_ads' ? sum(ar, 'reach') : i), periodWord),
          st('clicks', compact(c), i ? pct(c * 100 / i) + ' click-through' : ''),
          st('results', compact(sum(ar, 'conversions')), inr(sum(ar, 'spend')) + ' spent'),
        ] };
      }
      const f = followersAt(a), g = sum(ar, 'follower_delta');
      return { platform: PLATFORM[a.platform] || a.platform, name: a.handle && !/^https?:/i.test(a.handle) ? String(a.handle).toLowerCase() : name, statsVM: [
        st(a.platform === 'youtube' ? 'subscribers' : 'followers', f == null ? '—' : compact(f), g ? signed(g) + ' in ' + periodWord : '', g > 0 ? '#0A6E58' : g < 0 ? '#B4433A' : ''),
        a.platform === 'x' || a.platform === 'youtube'
          ? st('views', compact(ap.reduce((t, p) => t + pN(p, 'video_views'), 0) || sum(ar, 'video_views')), periodWord)
          : st('reach', compact(sum(ar, 'reach')), periodWord),
        st('content', String(ap.length), ap.length ? 'published' : 'nothing new'),
      ] };
    });

    // ---- best content ------------------------------------------------------
    const safe = u => (/^https:\/\//i.test(u || '') ? u : '');
    // Thumbs sit in an unquoted CSS url(); escape the few characters that end one.
    const cssUrl = u => String(u || '').replace(/[()\s'"\\]/g, c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'));
    // Newest first. Live: whatever went out most recently; a report: that month.
    const newest = (report ? feed : posts.filter(p => p.kind !== 'story'))
      .slice().sort((x, y) => String(y.published_at || '').localeCompare(String(x.published_at || ''))).slice(0, 12);
    const latestVM = newest.map(p => {
      const t = cssUrl(safe(p.thumb_url)), l = safe(p.permalink);
      return {
        thumb: t, hasThumb: !!t, href: l, hasLink: !!l, noLink: !l, kind: KIND[p.kind] || p.kind,
        when: fmtDay(p.published_at), platform: PLATFORM[plat(p.account_id)] || '',
        views: compact(pN(p, 'video_views') || base(p)), viewsLabel: pN(p, 'video_views') ? 'views' : 'reach',
        likes: compact(pN(p, 'likes')),
      };
    });
    const ranked = feed.slice().sort((x, y) => (pN(y, 'video_views') - pN(x, 'video_views')) || (base(y) - base(x)));
    const topVM = ranked.slice(0, 6).map((p, i) => {
      const e = base(p) ? inter(p) * 100 / base(p) : null;
      const thumb = cssUrl(safe(p.thumb_url)), link = safe(p.permalink);
      const cap = String(p.caption || '').replace(/\s+/g, ' ').trim();
      return {
        rank: String(i + 1).padStart(2, '0'), kind: KIND[p.kind] || p.kind, platform: PLATFORM[plat(p.account_id)] || '',
        when: fmtDay(p.published_at), caption: cap ? cap.slice(0, 140).toLowerCase() : 'no caption', captionColor: cap ? '#1B1D1E' : '#8A9390',
        thumb, hasThumb: !!thumb, link, hasLink: !!link,
        statsVM: [{ label: 'views', value: compact(pN(p, 'video_views')) }, { label: pN(p, 'reach') ? 'reach' : 'impressions', value: compact(base(p)) }, { label: 'eng. rate', value: pct(e) }],
      };
    });

    // ---- stories -----------------------------------------------------------
    const sViews = stories.reduce((t, p) => t + pN(p, 'video_views'), 0);
    const sReach = stories.reduce((t, p) => t + pN(p, 'reach'), 0);
    const sExits = stories.reduce((t, p) => t + pN(p, 'exits'), 0);
    const sReplies = stories.reduce((t, p) => t + pN(p, 'replies'), 0);
    const storyStatsVM = [
      { label: 'stories', value: String(stories.length), sub: 'posted in ' + periodWord },
      { label: 'avg views', value: stories.length ? compact(Math.round(sViews / stories.length)) : '—', sub: 'per story' },
      { label: 'avg reach', value: stories.length ? compact(Math.round(sReach / stories.length)) : '—', sub: 'people per story' },
      { label: 'stayed', value: sViews ? pct(100 - sExits * 100 / sViews) : '—', sub: 'watched without leaving' },
      { label: 'replies', value: compact(sReplies), sub: 'direct messages from stories' },
    ];
    const storyTilesVM = stories.slice(0, 12).map(p => { const t = cssUrl(safe(p.thumb_url)); return { thumb: t, hasThumb: !!t, views: compact(pN(p, 'video_views')), when: fmtDay(p.published_at) }; });

    // ---- ads ---------------------------------------------------------------
    const adCur = cur.filter(m => isAd(m.account_id)), adPrev = prev.filter(m => isAd(m.account_id));
    const aImp = sum(adCur, 'impressions'), aClk = sum(adCur, 'clicks'), aConv = sum(adCur, 'conversions'), aSpend = sum(adCur, 'spend'), aReach = sum(adCur, 'reach');
    const cv = deltaSub(aClk, sum(adPrev, 'clicks'), adCov, aImp ? pct(aClk * 100 / aImp) + ' click-through' : '');
    const adsVM = [
      { label: 'people reached', value: compact(aReach), sub: aReach ? 'saw an ad at least once' : 'reach comes from meta ads' },
      { label: 'impressions', value: compact(aImp), sub: 'times an ad was shown' },
      { label: 'clicks', value: compact(aClk), sub: cv.sub },
      { label: 'results', value: compact(aConv), sub: aConv && aSpend ? inr(aSpend / aConv) + ' each' : 'purchases and leads' },
      { label: 'spent', value: inr(aSpend), sub: aClk ? inr(aSpend / aClk) + ' per click' : 'in ' + periodWord },
    ];

    // ---- what stood out: plain sentences from the same numbers ---------------
    const hl = [];
    if (gain > 0) {
      const byP = socAccs.map(a => ({ p: PLATFORM[a.platform], g: sum(cur.filter(m => m.account_id === a.id), 'follower_delta') })).sort((x, y) => y.g - x.g);
      const lead = socAccs.length > 1 && byP[0].g > gain * 0.5 ? ', most of it on ' + byP[0].p : '';
      hl.push('you gained ' + compact(gain) + ' followers in ' + periodWord + (fNow - gain > 0 ? ' — ' + pct(gain * 100 / (fNow - gain)) + ' growth' : '') + lead + '.');
    }
    const rc = change(reach, reachPrev, socCov);
    if (rc != null && Math.abs(rc) >= 5) hl.push('reach was ' + (rc > 0 ? 'up ' : 'down ') + pctChange(rc) + ' on ' + prevWord + ', at ' + compact(reach) + ' accounts.');
    else if (reach) hl.push('your content reached ' + compact(reach) + ' accounts in ' + periodWord + '.');
    if (ranked[0] && (pN(ranked[0], 'video_views') || base(ranked[0]))) {
      const p = ranked[0], e = base(p) ? inter(p) * 100 / base(p) : null;
      hl.push('the strongest piece was a ' + (KIND[p.kind] || 'post') + ' from ' + fmtDay(p.published_at) + ' — ' + compact(pN(p, 'video_views') || base(p)) + (pN(p, 'video_views') ? ' views' : ' reach') + (e != null ? ' and ' + pct(e) + ' engagement' : '') + '.');
    }
    if (aImp) hl.push('ads were shown ' + compact(aImp) + ' times and brought ' + compact(aClk) + ' clicks' + (aConv ? ' and ' + compact(aConv) + ' results' : '') + '.');
    if (feed.length) {
      const c = {}; feed.forEach(p => { const k = p.kind === 'carousel' ? 'carousel' : p.kind; c[k] = (c[k] || 0) + 1; });
      const parts = Object.keys(c).sort((x, y) => c[y] - c[x]).map(k => c[k] + ' ' + (c[k] === 1 ? KIND[k] : KIND[k] + 's'));
      hl.push(plural(feed.length, 'piece', 'pieces') + ' went live' + (parts.length ? ': ' + parts.join(', ') : '') + (stories.length ? ', plus ' + plural(stories.length, 'story', 'stories') : '') + '.');
    }
    if (er != null && feed.length >= 3) hl.push('engagement ran at ' + pct(er) + ' of reach across the posts.');

    const latest = report ? { month: report.month, notes: report.notes, plan: report.plan } : (d.latest || null);
    const lm = latest && latest.month ? monthName(latest.month).split(' ')[0] : '';
    const nextOf = m => { const x = new Date(String(m).slice(0, 10) + 'T12:00:00'); x.setMonth(x.getMonth() + 1); return MONTHS[x.getMonth()]; };

    const heroFor = () => {
      if (report) return [monthName(from).split(' ')[0] + ', ', 'in review', '.'];
      if (rc != null && rc >= 5) return ['reach is up ', pctChange(rc), '.'];
      if (gain > 0 && fNow - gain > 0 && gain * 100 / (fNow - gain) >= 0.5) return ['your audience grew ', pct(gain * 100 / (fNow - gain)), '.'];
      return ['your digital, ', 'in numbers', '.'];
    };
    const [heroA, heroB, heroC] = heroFor();

    return {
      isReport: !!report, isLive: !report,
      kicker: report ? 'monthly report · published ' + fmtDay(report.published_at) : 'live insights' + (d.updated_at ? ' · updated ' + this.ago(d.updated_at) : ''),
      heroA, heroB, heroC,
      windowLabel: report ? fmtDay(from) + ' – ' + fmtDay(to) + ' ' + String(to).slice(0, 4) : fmtDay(from) + ' – ' + fmtDay(to),
      rangesVM: RANGES.map(([k, l]) => ({ label: l, go: () => this.setState({ range: k }), color: s.range === k ? '#1B1D1E' : '#8A9390', bar: s.range === k ? '#10AF8B' : 'transparent' })),
      empty: !cur.length && !wPosts.length,
      headlineVM,
      highlightsVM: hl.slice(0, 5).map(text => ({ text })), hasHighlights: hl.length > 0,
      chartTitle: chart === 'followers' ? 'audience growth' : 'daily reach',
      chartTabsVM: [['followers', 'followers'], ['reach', 'reach']].map(([k, l]) => ({ label: l, go: () => this.setState({ chart: k }), color: chart === k ? '#1B1D1E' : '#8A9390', bar: chart === k ? '#10AF8B' : 'transparent' })),
      chartHas: peak > 0, chartEmpty: peak <= 0,
      chartPath: pts.length ? 'M' + pts.join(' L') : '',
      chartArea: pts.length ? 'M0,' + (H - B) + ' L' + pts.join(' L') + ' L' + px(vals.length - 1).toFixed(1) + ',' + (H - B) + ' Z' : '',
      chartGridVM: [1, 0.75, 0.5, 0.25, 0].map(f => ({ y: py(lo + (hi - lo) * f), label: compact(lo + (hi - lo) * f) })),
      chartAxisVM: [0, Math.floor((dates.length - 1) / 2), dates.length - 1].filter((v, i, a) => a.indexOf(v) === i)
        .map(i => ({ label: fmtDay(dates[i]), align: i === 0 ? 'flex-start' : i === dates.length - 1 ? 'flex-end' : 'center' })),
      chartSummaryVM: chart === 'followers'
        ? [{ label: 'now', value: compact(last) }, { label: 'change', value: signed(last - first) }, { label: 'start', value: compact(first) }]
        : [{ label: 'total', value: compact(vals.reduce((t, v) => t + v, 0)) }, { label: 'a day', value: compact(Math.round(vals.reduce((t, v) => t + v, 0) / days)) }, { label: 'best day', value: best.v ? compact(best.v) + ' · ' + fmtDay(best.d) : '—' }],
      platformsVM, hasPlatforms: platformsVM.length > 0,
      topVM, hasTop: topVM.length > 0,
      latestVM, hasLatest: latestVM.length > 0, latestHint: latestVM.length > 2 ? 'swipe →' : '',
      storyStatsVM, storyTilesVM, hasStories: stories.length > 0,
      adsVM, hasAds: adAccs.length > 0 && (aImp > 0 || aSpend > 0),
      notes: (latest && latest.notes) || '', hasNotes: !!(latest && latest.notes),
      plan: (latest && latest.plan) || '', hasPlan: !!(latest && latest.plan),
      notesLabel: report ? 'notes on ' + lm : 'notes from glomium · ' + lm,
      planLabel: latest && latest.month ? 'the plan for ' + nextOf(latest.month) : 'the plan',
      hasTeam: !!(latest && (latest.notes || latest.plan)),
    };
  }

  ago(t) {
    const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
    return m < 2 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : fmtDay(t);
  }

  renderVals() {
    const s = this.state, d = s.data;
    const b = s.brand || (d && (d.brand || { client: d.client, logo: d.logo })) || {};
    const client = String(b.client || '');
    const logo = b.logo && /^https:\/\//i.test(b.logo) && !s.logoFailed && s.logoRatio
      ? String(b.logo).replace(/[()\s'"\\]/g, c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')) : '';
    const sinceD = b.since ? new Date(String(b.since).slice(0, 10) + 'T12:00:00') : null;
    const since = sinceD && !isNaN(sinceD) ? MON[sinceD.getMonth()] + ' ' + sinceD.getFullYear() : '';
    const lr = Math.min(Math.max(s.logoRatio || 3, 0.6), 8);
    const reasons = {
      invalid: ['this link is not valid', 'it may have been mistyped, or replaced with a newer one. ask your glomium contact for the current link.'],
      locked: ['too many tries', 'the page is locked for 15 minutes after five wrong pins. try again after that, or ask us to reset it.'],
      nopin: ['almost ready', 'we are still setting this page up. your glomium contact will send the pin when it is ready.'],
      offline: ['could not connect', 'check your connection and reload the page.'],
      missing: ['report not found', 'that month has not been published yet.'],
    };
    const dead = !s.loading && !!reasons[s.reason];
    const page = !s.loading && !s.reason && d && (d.mode === 'live' || d.mode === 'report');
    const vm = page ? this.build(d) : {};
    const reports = (d && d.reports) || [];
    return {
      loading: s.loading,
      hasClient: !!client, clientName: client, clientLower: client.toLowerCase(), gateClient: client ? client.toLowerCase() : 'you',
      logo, hasLogo: !!logo, noLogo: !logo && !!client,
      logoW22: Math.round(22 * lr) + 'px', logoW44: Math.round(44 * lr) + 'px', logoW56: Math.round(56 * lr) + 'px',
      logoW64: Math.round(64 * lr) + 'px',
      // A white mark sits on a small ink plate instead of vanishing.
      plateBg: logo && s.logoOnInk ? '#1B1D1E' : 'transparent',
      platePad: logo && s.logoOnInk ? '14px 20px' : '0',
      clientRole: since ? 'since ' + since : 'client',
      cellName: client.toLowerCase(),
      partnerLine: 'digital partnership' + (since ? ' · since ' + since : ''),
      dead, deadTitle: dead ? reasons[s.reason][0] : '', deadNote: dead ? reasons[s.reason][1] : '',
      showGate: !s.loading && s.reason === 'gate',
      pin: s.pin,
      onPin: e => {
        const v = String(e.target.value || '').replace(/\D/g, '').slice(0, 4);
        this.setState({ pin: v, gateStatus: '' });
        if (v.length === 4 && !s.checking) this.fetch(v);
      },
      onPinKey: e => { if (e.key === 'Enter' && s.pin.length === 4) this.fetch(s.pin); },
      openPin: () => (s.pin.length === 4 ? this.fetch(s.pin) : this.setState({ gateStatus: 'the pin is four digits.' })),
      checking: s.checking, openLabel: s.checking ? 'opening…' : 'open',
      gateStatus: s.gateStatus, hasGateStatus: !!s.gateStatus,
      showPage: !!page,
      ...vm,
      hasReports: reports.length > 0,
      reportsVM: reports.map(r => ({
        label: monthName(r.month), sub: 'published ' + fmtDay(r.published_at),
        cta: vm.isReport && d.report && String(d.report.month).slice(0, 7) === String(r.month).slice(0, 7) ? 'open now' : 'read →',
        go: () => this.openMonth(String(r.month).slice(0, 10)),
      })),
      goReports: () => { const el = document.getElementById('reports'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth' }); },
      goLive: () => this.openMonth(null),
      refresh: () => this.refresh(),
      refreshing: !!s.refreshing,
      refreshLabel: s.refreshing ? 'refreshing…' : '↻ refresh',
      refreshColor: s.refreshing ? '#8A9390' : '#0A6E58',
      refreshTitle: 'pull the latest numbers from every platform',
      refreshNote: s.refreshNote || '', hasRefreshNote: !!s.refreshNote && !!page && !(vm && vm.isReport),
    };
  }
}

// Sample bundle for ?demo=1, so the page can be reviewed without a live link.
function demoData(month) {
  const to = iso(new Date()), A = 'ig', F = 'fb', M = 'ads';
  const metrics = [], posts = [];
  // A count every day, walked back from today through each day's gain — the
  // way the hourly sync records it, so past months have readings too.
  let igF = 22184, fbF = 8410;
  for (let i = 0; i < 120; i++) {
    const d = addDays(to, -i), w = 1 + 0.25 * Math.sin(i / 5);
    const ig = Math.round(9 - i * 0.04 + (i % 7 === 2 ? 14 : 0)), fb = 2;
    metrics.push({ account_id: A, on_date: d, reach: Math.round((3400 - i * 9) * w), follower_delta: ig, followers: igF });
    metrics.push({ account_id: F, on_date: d, reach: Math.round(900 * w), follower_delta: fb, followers: fbF });
    igF -= ig; fbF -= fb;
    metrics.push({ account_id: M, on_date: d, reach: Math.round(4200 * w), impressions: Math.round(9800 * w), clicks: Math.round(150 * w), conversions: i % 3 === 0 ? 3 : 1, spend: Math.round(700 * w) });
  }
  const kinds = ['reel', 'post', 'carousel', 'reel', 'reel', 'post'];
  for (let i = 0; i < 26; i++) {
    const at = new Date(Date.now() - (i * 2.6 + 0.5) * 86400000).toISOString();
    posts.push({ account_id: i % 5 === 4 ? F : A, kind: kinds[i % kinds.length], caption: ['the new flagship, in hand', 'exchange day at the store — bring your old phone', 'three colours, one choice', 'unboxing, slowly', 'weekend offer ends sunday', 'behind the counter'][i % 6], published_at: at, reach: 4200 + ((i * 937) % 6100), likes: 180 + ((i * 53) % 400), comments: 6 + (i % 9), shares: 4 + (i % 13), saves: 9 + (i % 17), video_views: kinds[i % kinds.length] === 'reel' ? 9000 + ((i * 1777) % 21000) : 2600 + ((i * 311) % 3000) });
  }
  for (let i = 0; i < 9; i++) posts.push({ account_id: A, kind: 'story', published_at: new Date(Date.now() - (i * 3 + 0.2) * 86400000).toISOString(), reach: 760 + i * 31, video_views: 880 + i * 40, exits: 30 + i * 3, replies: i % 3 });
  const accounts = [{ id: A, platform: 'instagram', label: 'mr.fone', handle: '@mrfone' }, { id: F, platform: 'facebook', label: 'mr.fone', handle: 'mr.fone kerala' }, { id: M, platform: 'meta_ads', label: 'store campaigns' }];
  const d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth() - 1);
  const m0 = iso(d0), m1 = (() => { const x = new Date(d0); x.setMonth(x.getMonth() - 1); return iso(x); })();
  const reports = [{ month: m0, published_at: addDays(to, -6) }, { month: m1, published_at: addDays(to, -36) }];
  const notes = 'reels carried the month — the exchange-day series did twice the views of the product shots.\nstories were steadier than last month, with fewer people skipping past the second frame.';
  const plan = 'more short reels from the store floor, two a week.\na festive offer campaign from the 20th, with a tighter audience around the three stores.';
  const base = { ok: true, client: 'Mr.Fone', logo: '', reports, brand: { client: 'Mr.Fone', logo: '', since: '2025-09-01' } };
  if (month) {
    const f = String(month).slice(0, 7) + '-01', e = (() => { const x = new Date(f + 'T12:00:00'); x.setMonth(x.getMonth() + 1); x.setDate(0); return iso(x); })();
    const pf = (() => { const x = new Date(f + 'T12:00:00'); x.setMonth(x.getMonth() - 1); return iso(x); })();
    return { ...base, mode: 'report', report: { month: f, published_at: addDays(e, 3), notes, plan, snapshot: { from: f, to: e, prev_from: pf, accounts, metrics, posts } } };
  }
  return { ...base, mode: 'live', accounts, metrics, posts, updated_at: new Date(Date.now() - 14 * 60000).toISOString(), latest: { month: m0, notes, plan } };
}
