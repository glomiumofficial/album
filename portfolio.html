<div ref="{{ rootRef }}" style="position: relative; font-weight: 300;">

  <section id="top" ref="{{ heroRef }}" data-screen-label="01 reel" style="position: relative; height: 280vh;">

        <div style="position: absolute; left: clamp(20px, 4vw, 56px); right: clamp(20px, 4vw, 56px); bottom: 72px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; color: #FFFFFF;">
          <div style="display: flex; flex-direction: column; gap: 14px;">
            <span style="font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase;">01 — showreel</span>

          <div data-intro="" style="visibility: visible; position: absolute; left: 0; right: 0; bottom: calc(100% + 0.22em); text-align: center; font-size: clamp(15px, 0.1em, 34px); font-weight: 300; letter-spacing: 0.5em; line-height: 1; color: #1B1D1E;">creative</div>
          <div data-intro="" style="visibility: visible; position: absolute; left: 0; right: 0; top: calc(100% + 0.26em); display: flex; justify-content: space-between; gap: 24px; font-size: 10px; font-weight: 300; letter-spacing: 2.6px; line-height: 1.6; text-transform: uppercase; color: #8A9390;">
            <span>a private reel</span>
            <span>for our clients</span>
          </div>
        </div>
      </div>
      <div ref="{{ cueRef }}" style="position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390; pointer-events: none;">
        <span>scroll</span>

      </div>

  <section id="works" ref="{{ worksRef }}" data-screen-label="02 works" style="position: relative; height: {{ worksHeight }};">
    <div style="position: sticky; top: 0; height: 100vh; overflow: hidden; perspective: 1600px;">
      <div ref="{{ sceneRef }}" style="position: absolute; inset: 0; transform-style: preserve-3d;">
        <div ref="{{ worksTitleRef }}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transform: translateZ(0);">
          <h2 style="margin: 0; font-weight: 200; font-size: clamp(48px, 12vw, 230px); line-height: 1; letter-spacing: -0.035em; white-space: nowrap; color: #1B1D1E;">selected <span style="font-style: italic; color: #10AF8B;">works</span></h2>
        </div>
        <sc-for list="{{ works }}" as="w" hint-placeholder-count="3">
          <article data-card="" onClick="{{ w.open }}" onMouseEnter="{{ showCursor }}" onMouseLeave="{{ hideCursor }}" style="position: absolute; left: 50%; top: 50%; width: {{ w.width }}; cursor: none; opacity: 0;">
            <div style="position: relative; width: 100%; aspect-ratio: {{ w.ratio }}; overflow: hidden; background: #EEF3F1; box-shadow: 0 28px 60px -34px rgba(10,110,88,0.38);">
              <div data-par="" style="position: absolute; top: 0; bottom: 0; left: -6%; right: -6%;">
                <sc-if value="{{ w.hasCover }}" hint-placeholder-val="{{ false }}"><img ref="{{ mediaRef }}" data-src="{{ w.cover }}" alt="" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>
                <sc-if value="{{ w.slot }}" hint-placeholder-val="{{ false }}"><image-slot id="work-{{ w.id }}" shape="rect" placeholder="cover still"></image-slot></sc-if>
              </div>
              <div data-catch="" style="position: absolute; inset: 0; z-index: 2;"></div>
            </div>
            <div data-cap="" style="position: absolute; left: 0; right: 0; top: calc(100% + 14px); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; opacity: 0;">
              <div style="display: flex; gap: 14px; align-items: baseline;">
                <span style="font-size: 10px; letter-spacing: 2.6px; color: #10AF8B;">{{ w.no }}</span>
                <span style="font-size: 19px; color: #1B1D1E;">{{ w.title }}</span>
              </div>
              <span style="font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390;">{{ w.kind }}</span>
            </div>
          </article>
        </sc-for>
      </div>
      <div style="position: absolute; top: 84px; left: clamp(20px, 4vw, 56px); right: clamp(20px, 4vw, 56px); display: flex; justify-content: space-between; gap: 24px; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390; pointer-events: none;">
        <span>02 — selected works</span>
        <span ref="{{ counterRef }}" style="font-variant-numeric: tabular-nums;">01 / {{ workCount }}</span>
      </div>
    </div>
  </section>

  <section id="bts" ref="{{ btsRef }}" data-screen-label="03 behind the scenes" style="position: relative; height: {{ btsHeight }};">
    <div style="position: sticky; top: 0; height: 100vh; overflow: hidden; perspective: 1000px;">
      <div ref="{{ btsSceneRef }}" style="position: absolute; inset: 0; transform-style: preserve-3d;">
        <div data-depth="" data-fx="0" data-fy="0" data-z="-150" style="position: absolute; left: 50%; top: 50%; width: 92vw; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; pointer-events: none;">
          <h2 style="margin: 0; font-weight: 200; font-size: clamp(44px, 9.5vw, 180px); line-height: 1; letter-spacing: -0.035em; white-space: nowrap; color: #1B1D1E;">behind <span style="font-style: italic; color: #10AF8B;">the</span> scenes</h2>
          <p style="margin: 0; max-width: 24em; font-size: 16px; line-height: 1.8; color: #4A524F;">the waiting, the light-chasing, the laughing between takes. the part nobody frames — so we did.</p>
        </div>
        <sc-for list="{{ bts }}" as="b" hint-placeholder-count="3">
          <figure data-depth="" data-fx="{{ b.fx }}" data-fy="{{ b.fy }}" data-z="{{ b.z }}" style="position: absolute; left: 50%; top: 50%; width: {{ b.w }}; margin: 0; opacity: 0; visibility: hidden;">
            <div style="position: relative; width: 100%; aspect-ratio: {{ b.ratio }}; overflow: hidden; background: #EEF3F1; box-shadow: 0 24px 56px -30px rgba(10,110,88,0.34);">
              <sc-if value="{{ b.hasImg }}" hint-placeholder-val="{{ false }}"><img ref="{{ mediaRef }}" data-src="{{ b.img }}" alt="" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>
              <sc-if value="{{ b.slot }}" hint-placeholder-val="{{ false }}"><image-slot id="bts-{{ b.id }}" shape="rect" placeholder="bts photo"></image-slot></sc-if>
            </div>
            <figcaption style="display: flex; gap: 12px; padding-top: 12px; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390;">
              <span style="color: #10AF8B;">{{ b.no }}</span>
              <span>{{ b.caption }}</span>
            </figcaption>
          </figure>
        </sc-for>
      </div>
      <div style="position: absolute; top: 84px; left: clamp(20px, 4vw, 56px); font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390; pointer-events: none;">03 — behind the scenes</div>
    </div>
  </section>

  <section id="process" ref="{{ processRef }}" data-screen-label="04 process" style="position: relative; padding: clamp(120px, 16vw, 220px) clamp(20px, 4vw, 56px); display: flex; flex-wrap: wrap; gap: clamp(40px, 6vw, 96px); align-items: flex-start;">
    <div style="flex: 1 1 280px; position: sticky; top: 120px; display: flex; flex-direction: column; gap: 22px;">
      <span style="font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #8A9390;">04 — process</span>
      <h2 style="margin: 0; font-weight: 200; font-size: clamp(44px, 6.4vw, 110px); line-height: 0.95; letter-spacing: -0.03em;">how we <span style="font-style: italic; color: #10AF8B;">work</span></h2>
    </div>
    <ol style="flex: 2 1 520px; list-style: none; margin: 0; padding: 0; border-top: 1px solid #E2E7E5;">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
        <li style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 28px; padding: clamp(26px, 3.2vw, 44px) 0; border-bottom: 1px solid #E2E7E5; transition: padding 0.5s cubic-bezier(.2,.8,.2,1), border-color 0.5s;" style-hover="padding-left: 22px; border-bottom-color: #10AF8B;">

  <footer style="position: relative; padding: clamp(100px, 12vw, 180px) clamp(20px, 4vw, 56px) 110px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center;">

    <div style="font-size: 16px; line-height: 1.8; color: #4A524F;">with love,<br>team glomium.</div>
    <div style="width: 48px; height: 1px; background: #E2E7E5;"></div>
    <div style="font-size: 11px; letter-spacing: 2.6px; color: #8A9390;">creative INFINITELY</div>

  <sc-if value="{{ hudOn }}" hint-placeholder-val="{{ true }}">

      <span ref="{{ chapterRef }}" style="flex: 0 0 110px;">01 reel</span>
      <div ref="{{ tickRef }}" style="position: relative; flex: 1 1 auto; height: 11px;">
        <div style="position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: currentColor; opacity: 0.22;"></div>
        <div data-tick="" style="position: absolute; top: 2px; width: 1px; height: 7px; background: currentColor; opacity: 0.5;"></div>
        <div data-tick="" style="position: absolute; top: 2px; width: 1px; height: 7px; background: currentColor; opacity: 0.5;"></div>
        <div data-tick="" style="position: absolute; top: 2px; width: 1px; height: 7px; background: currentColor; opacity: 0.5;"></div>
        <div data-tick="" style="position: absolute; top: 2px; width: 1px; height: 7px; background: currentColor; opacity: 0.5;"></div>
        <div ref="{{ playheadRef }}" style="position: absolute; top: -2px; left: 0; width: 2px; height: 15px; background: #10AF8B; will-change: transform;"></div>
      </div>
      <span ref="{{ tcRef }}" style="flex: 0 0 110px; text-align: right; font-variant-numeric: tabular-nums;">00:00:00:00</span>
    </div>
  </sc-if>

  <div ref="{{ caseRef }}" data-screen-label="case" style="position: fixed; inset: 0; z-index: 90; overflow-y: auto; overscroll-behavior: contain; background: linear-gradient(180deg, #FFFFFF 0%, #F2F8F5 42%, #FFFFFF 100%); clip-path: inset(100% 0% 0% 0%); pointer-events: none; transition: clip-path 1s cubic-bezier(.77,0,.18,1);">
    <div style="position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px clamp(20px, 4vw, 56px); background: rgba(255,255,255,0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase;">
      <button onClick="{{ close }}" style="border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #0E8E72; cursor: pointer; padding: 0;">close</button>

      <div style="display: flex; gap: 28px;">
        <button onClick="{{ prev }}" style="border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #1B1D1E; cursor: pointer; padding: 0;" style-hover="color: #10AF8B;">prev</button>
        <button onClick="{{ next }}" style="border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #1B1D1E; cursor: pointer; padding: 0;" style-hover="color: #10AF8B;">next</button>
      </div>
    </div>

    <div style="padding: clamp(56px, 9vw, 130px) clamp(20px, 4vw, 56px) clamp(40px, 5vw, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 40px;">
      <div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 22px;">
        <span data-rise="" style="font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: #10AF8B;">{{ activeWork.no }} — {{ activeWork.kind }}</span>
        <h2 data-rise="" style="margin: 0; font-weight: 200; font-size: clamp(56px, 11vw, 200px); line-height: 0.9; letter-spacing: -0.04em;">{{ activeWork.title }}</h2>

        <sc-if value="{{ activeWork.posterOnly }}" hint-placeholder-val="{{ false }}"><img ref="{{ mediaRef }}" data-src="{{ activeWork.hero }}" alt="" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>

    </div>

    <div style="padding: clamp(100px, 12vw, 170px) clamp(20px, 4vw, 56px) 0; display: flex; flex-direction: column; gap: 40px;">

    <div style="padding: clamp(100px, 12vw, 170px) 0 0; display: flex; flex-direction: column; gap: 40px;">
      <div style="padding: 0 clamp(20px, 4vw, 56px); display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;">
        <h3 style="margin: 0; font-weight: 200; font-size: clamp(36px, 5vw, 80px); line-height: 1; letter-spacing: -0.03em;">behind <span style="font-style: italic; color: #10AF8B;">the</span> scenes</h3>

      <div style="display: flex; gap: clamp(12px, 1.6vw, 24px); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 clamp(20px, 4vw, 56px) 8px; scroll-padding: 0 clamp(20px, 4vw, 56px);">

          <div style="position: relative; flex: 0 0 auto; width: clamp(220px, 26vw, 420px); aspect-ratio: {{ c.ratio }}; overflow: hidden; background: #EEF3F1; scroll-snap-align: start;">
            <sc-if value="{{ c.hasImg }}" hint-placeholder-val="{{ false }}"><img ref="{{ mediaRef }}" data-src="{{ c.img }}" alt="" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>

  pad(n) { return String(n).padStart(2, '0'); }

  async loadDb() {
